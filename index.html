<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Investment</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

:root{
  --navy:   #0d1b2e;
  --navy2:  #122540;
  --navy3:  #172d4d;
  --panel:  #1a3358;
  --card:   #1e3a62;
  --card2:  #243f6a;
  --border: #2a4a7a;
  --border2:#3a5a8a;
  --blue:   #3a6fd8;
  --blue2:  #5b8def;
  --blue3:  #7aa3f0;
  --blue4:  #a8c4f8;
  --accent: #4f81e8;
  --white:  #f0f4ff;
  --white2: #d0ddf5;
  --gray:   #7a99c4;
  --gray2:  #4a6a9a;
  --green:  #22d68a;
  --green2: #16a86a;
  --green-bg:#0a2a1a;
  --red:    #ff4d6a;
  --red2:   #cc3a55;
  --red-bg: #2a0a12;
  --amber:  #f0b429;
  --cyan:   #22d4f0;
  --yellow: #e8f43a;
  --font:   'Inter', sans-serif;
  --mono:   'JetBrains Mono', 'Courier New', monospace;
}

html,body{background:var(--navy);color:var(--white);font-family:var(--font);font-size:13px;min-height:100vh;overflow:hidden}

::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--navy2)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* ─── TOP BAR ─── */
.top-bar{
  background:linear-gradient(135deg, var(--navy2) 0%, var(--navy3) 100%);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;height:56px;position:sticky;top:0;z-index:200;
  box-shadow:0 2px 16px rgba(0,0,0,.4);
}
.logo-area{display:flex;align-items:center;gap:12px}
.logo-svg{width:40px;height:40px;flex-shrink:0}
.logo-text{display:flex;flex-direction:column;line-height:1.1}
.logo-text strong{font-size:16px;font-weight:800;color:var(--white);letter-spacing:-.02em}
.logo-text span{font-size:10px;font-weight:500;color:var(--blue3);letter-spacing:.08em;text-transform:uppercase}
.top-right{display:flex;align-items:center;gap:16px}
.top-badge{font-size:10px;font-weight:600;color:var(--blue4);letter-spacing:.06em;font-family:var(--mono)}
#clock{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--blue3);letter-spacing:.04em;
  background:var(--navy);padding:3px 8px;border:1px solid var(--border);border-radius:4px}

/* ─── NAV TABS ─── */
.nav-bar{
  background:var(--navy2);border-bottom:2px solid var(--border);
  display:flex;align-items:stretch;padding:0 20px;gap:0;
}
.nav-tab{
  display:flex;align-items:center;gap:8px;padding:0 22px;height:42px;
  font-family:var(--font);font-size:12px;font-weight:600;
  letter-spacing:.04em;text-transform:uppercase;
  color:var(--gray);border:none;background:none;
  cursor:pointer;border-bottom:2px solid transparent;
  margin-bottom:-2px;transition:all .15s;white-space:nowrap;
}
.nav-tab:hover{color:var(--blue3);background:rgba(58,111,216,.08)}
.nav-tab.active{color:var(--white);border-bottom-color:var(--blue);background:rgba(58,111,216,.12)}
.nav-tab .tab-icon{font-size:14px}
.nav-spacer{flex:1}
.nav-meta{display:flex;align-items:center;gap:8px;padding:0 4px}
.nav-meta-txt{font-size:10px;color:var(--gray2);letter-spacing:.06em;font-family:var(--mono)}

/* ── Dropdown nav ── */
.nav-dropdown{position:relative;display:flex;align-items:stretch}
.nav-dropdown-btn{display:flex;align-items:center;gap:7px;padding:0 18px;height:42px;font-family:var(--font);font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--gray);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s;white-space:nowrap;user-select:none;}
.nav-dropdown-btn:hover{color:var(--blue3);background:rgba(58,111,216,.08)}
.nav-dropdown-btn.open{color:var(--white);background:rgba(58,111,216,.08)}
.nav-dropdown-btn .dd-arrow{font-size:8px;opacity:.6;transition:transform .15s}
.nav-dropdown-btn.open .dd-arrow{transform:rotate(180deg);opacity:1}
.nav-dropdown-menu{display:none;position:absolute;top:42px;left:0;z-index:500;background:var(--navy3);border:1px solid var(--border);border-top:2px solid var(--blue);min-width:200px;padding:4px 0;box-shadow:0 8px 24px rgba(0,0,0,.5);}
.nav-dropdown.open .nav-dropdown-menu{display:block}
.nav-dropdown-item{display:flex;align-items:center;gap:9px;padding:8px 16px;font-family:var(--font);font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--gray2);cursor:pointer;border:none;background:none;width:100%;text-align:left;text-decoration:none;transition:all .12s;border-left:2px solid transparent;}
.nav-dropdown-item:hover{color:var(--white);background:rgba(58,111,216,.12);border-left-color:var(--blue);}
.nav-dropdown-item.active{color:var(--blue3);background:rgba(58,111,216,.1);border-left-color:var(--blue2);}
.nav-dropdown-item .di-icon{font-size:13px;width:16px;text-align:center}

/* ── iframe shell ── */
html,body{height:100%;overflow:hidden}
.iframe-container{position:fixed;top:98px;left:0;right:0;bottom:0}
.page-frame{display:none;width:100%;height:100%;border:none;background:var(--navy)}
.page-frame.active{display:block}
</style>
</head>
<body>

<div class="top-bar">
  <div class="logo-area">
    <svg class="logo-svg" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="20" cy="20" r="19" fill="url(#lgOuter)" stroke="#2a4a8a" stroke-width="1"/>
      <path d="M20 20 L20 2 A18 18 0 0 1 38 20 Z" fill="url(#lgSlice)"/>
      <path d="M20 20 L2 20 A18 18 0 0 1 20 2 Z" fill="#3a6fd8" opacity=".6"/>
      <circle cx="20" cy="20" r="7" fill="url(#lgInner)" stroke="#1a3358" stroke-width="1.5"/>
      <circle cx="20" cy="20" r="3" fill="#0d1b2e"/>
      <defs>
        <radialGradient id="lgOuter" cx="40%" cy="35%"><stop offset="0%" stop-color="#3a6fd8"/><stop offset="100%" stop-color="#1a2d5a"/></radialGradient>
        <linearGradient id="lgSlice" x1="20" y1="2" x2="38" y2="20" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#5b8def"/><stop offset="100%" stop-color="#2a5abf"/></linearGradient>
        <radialGradient id="lgInner" cx="40%" cy="35%"><stop offset="0%" stop-color="#5b8def"/><stop offset="100%" stop-color="#1a3870"/></radialGradient>
      </defs>
    </svg>
    <div class="logo-text">
      <strong>Portfolio Investment</strong>
      <span>Sistema de Cálculo Financiero</span>
    </div>
  </div>
  <div class="top-right">
    <span class="top-badge">BYMA · MERVAL · MCE</span>
    <span id="clock">--:--:--</span>
  </div>
</div>


<div class="nav-bar">
  <button class="nav-tab active" id="nav-resumen" onclick="showPage('resumen')"><span class="tab-icon">◉</span> Resumen</button>

  <div class="nav-dropdown" id="dd-calc">
    <button class="nav-dropdown-btn" id="ddbtn-calc">🧮 Calculadoras <span class="dd-arrow">▼</span></button>
    <div class="nav-dropdown-menu">
      <button class="nav-dropdown-item" onclick="showPage('tc')">    <span class="di-icon">💸</span> TC / Canje</button>
      <button class="nav-dropdown-item" onclick="showPage('cauc')">  <span class="di-icon">⬡</span> Cauciones</button>
      <button class="nav-dropdown-item" onclick="showPage('dcto')">  <span class="di-icon">◈</span> Descuento de Cheques</button>
    </div>
  </div>

  <div class="nav-dropdown" id="dd-bonos">
    <button class="nav-dropdown-btn" id="ddbtn-bonos">📊 Bonos <span class="dd-arrow">▼</span></button>
    <div class="nav-dropdown-menu">
      <button class="nav-dropdown-item" onclick="showPage('lecap')">      <span class="di-icon">◆</span> LECAP / BONCAP</button>
      <button class="nav-dropdown-item" onclick="showPage('bonos')">      <span class="di-icon">◇</span> Soberanos USD</button>
      <button class="nav-dropdown-item" onclick="showPage('cer')">        <span class="di-icon">◎</span> Bonos CER</button>
      <button class="nav-dropdown-item" onclick="showPage('dolarlinked')"><span class="di-icon">◐</span> Dólar Linked</button>
    </div>
  </div>

  <div class="nav-dropdown" id="dd-estrat">
    <button class="nav-dropdown-btn" id="ddbtn-estrat">⚡ Estrategias <span class="dd-arrow">▼</span></button>
    <div class="nav-dropdown-menu">
      <button class="nav-dropdown-item" onclick="showPage('arb')"><span class="di-icon">⇄</span> Arbitraje GD30/AL30</button>
    </div>
  </div>

  <div class="nav-spacer"></div>
  <div class="nav-meta"><span class="nav-meta-txt">REF.06 · BYMA 2026</span></div>
</div>

<div class="iframe-container">
  <iframe class="page-frame active" id="frame-resumen"     src="resumen.html"      title="Resumen"></iframe>
  <iframe class="page-frame"        id="frame-tc"          src="TC.html"           title="TC / Canje"></iframe>
  <iframe class="page-frame"        id="frame-cauc"        src="cauciones.html"    title="Cauciones"></iframe>
  <iframe class="page-frame"        id="frame-dcto"        src="cheques.html"      title="Descuento de Cheques"></iframe>
  <iframe class="page-frame"        id="frame-lecap"       src="lecap.html"        title="LECAP / BONCAP"></iframe>
  <iframe class="page-frame"        id="frame-bonos"       src="bonos.html"        title="Soberanos USD"></iframe>
  <iframe class="page-frame"        id="frame-cer"         src="cer.html"          title="Bonos CER"></iframe>
  <iframe class="page-frame"        id="frame-dolarlinked" src="dolarlinked.html"  title="Dólar Linked"></iframe>
  <iframe class="page-frame"        id="frame-arb"         src="arbitraje.html"    title="Arbitraje"></iframe>
</div>

<script>
const PAGE_IDS = ["resumen", "tc", "cauc", "dcto", "lecap", "bonos", "cer", "dolarlinked", "arb"];
const CALC_GROUP  = ['tc','cauc','dcto'];
const BONOS_GROUP = ['lecap','bonos','cer','dolarlinked'];
const ESTRAT_GROUP= ['arb'];

// Clock
function tick(){const n=new Date(),p=v=>String(v).padStart(2,'0');document.getElementById('clock').textContent=`${p(n.getHours())}:${p(n.getMinutes())}:${p(n.getSeconds())}`;}
tick();setInterval(tick,1000);

function showPage(id){
  // iframes
  PAGE_IDS.forEach(p=>{
    document.getElementById('frame-'+p).classList.toggle('active',p===id);
  });
  // top-level tab
  document.querySelectorAll('.nav-bar > .nav-tab').forEach(t=>t.classList.remove('active'));
  const topBtn=document.getElementById('nav-'+id);
  if(topBtn)topBtn.classList.add('active');
  // dropdown items highlight
  document.querySelectorAll('.nav-dropdown-item').forEach(item=>item.classList.remove('active'));
  // close all dropdowns
  document.querySelectorAll('.nav-dropdown').forEach(d=>d.classList.remove('open'));
  document.querySelectorAll('.nav-dropdown-btn').forEach(b=>b.classList.remove('open'));
  // URL hash
  history.replaceState(null,'','#'+id);
}

// Hash-based routing on load
(function(){
  const hash=location.hash.replace('#','');
  if(PAGE_IDS.includes(hash))showPage(hash);
})();


// ── Dropdown nav logic (index shell) ──
document.querySelectorAll('.nav-dropdown-btn').forEach(btn=>{
  btn.addEventListener('click',function(e){
    e.stopPropagation();
    const dd=this.closest('.nav-dropdown');
    const isOpen=dd.classList.contains('open');
    document.querySelectorAll('.nav-dropdown').forEach(d=>d.classList.remove('open'));
    document.querySelectorAll('.nav-dropdown-btn').forEach(b=>b.classList.remove('open'));
    if(!isOpen){dd.classList.add('open');this.classList.add('open');}
  });
});
document.addEventListener('click',()=>{
  document.querySelectorAll('.nav-dropdown').forEach(d=>d.classList.remove('open'));
  document.querySelectorAll('.nav-dropdown-btn').forEach(b=>b.classList.remove('open'));
});

</script>
</body>
</html>
