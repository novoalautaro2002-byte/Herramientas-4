<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora FX Pro - Portfolio Investment</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');

        :root {
            --bg: #070d17;
            --card-bg: #0f172a;
            --input-bg: #020617;
            --border: #1e293b;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --green: #22c55e;
            --red: #ef4444;
            --amber: #f59e0b;
            --font: 'Inter', sans-serif;
            --mono: 'JetBrains Mono', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: var(--bg); 
            color: var(--text-main); 
            font-family: var(--font); 
            padding: 20px;
            min-height: 100vh;
        }

        /* TOOLBAR */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            background: var(--card-bg);
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .mode-selector {
            display: flex;
            background: var(--input-bg);
            padding: 4px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .mode-btn {
            padding: 8px 20px;
            border: none;
            background: transparent;
            color: var(--text-dim);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .mode-btn.active {
            background: var(--accent);
            color: white;
        }

        .api-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: var(--mono);
            font-size: 11px;
            font-weight: 700;
            color: var(--green);
        }

        .pulse {
            width: 8px;
            height: 8px;
            background: var(--green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--green);
            animation: pulse-anim 2s infinite;
        }

        @keyframes pulse-anim {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* MAIN CONTENT */
        .layout {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            position: relative;
        }

        .section-title {
            font-size: 11px;
            font-weight: 800;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* FORMS */
        .grid-inputs {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 20px;
        }

        .input-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        select, input {
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-family: var(--mono);
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus { border-color: var(--accent); }
        input[type="number"] { color: var(--amber); font-weight: 700; }

        /* MARKET WATCH */
        .market-watch {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .m-card {
            flex: 1;
            background: var(--input-bg);
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid var(--border);
        }

        .m-label { font-size: 9px; color: var(--text-dim); margin-bottom: 4px; font-weight: 700; }
        .m-price { font-family: var(--mono); font-size: 14px; font-weight: 700; }

        /* RESULTS PANEL */
        .res-main {
            text-align: center;
            padding: 30px 0;
            background: linear-gradient(180deg, rgba(59,130,246,0.1) 0%, transparent 100%);
            border-radius: 12px;
            margin-bottom: 24px;
            border: 1px solid rgba(59,130,246,0.2);
        }

        .res-label { font-size: 10px; color: var(--accent); font-weight: 800; letter-spacing: 1px; margin-bottom: 10px; }
        .res-val { font-family: var(--mono); font-size: 42px; font-weight: 800; letter-spacing: -1px; }

        .data-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .data-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .d-label { color: var(--text-dim); }
        .d-val { font-family: var(--mono); font-weight: 600; }
        .d-val.red { color: var(--red); }
        .d-val.green { color: var(--green); font-size: 18px; }

        hr { border: 0; border-top: 1px solid var(--border); margin: 16px 0; }

        @media (max-width: 900px) {
            .layout { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="toolbar">
        <div class="mode-selector">
            <button id="btn-tc" class="mode-btn active" onclick="setMode('TC')">Tipo de Cambio</button>
            <button id="btn-canje" class="mode-btn" onclick="setMode('CANJE')">Arbitraje Canje</button>
        </div>
        <div class="api-badge" id="api-status">
            <div class="pulse"></div> 
            <span>DATA912 PRO LIVE</span>
        </div>
    </div>

    <div class="layout">
        <div class="card">
            <div id="ui-tc">
                <div class="section-title">Calculadora Tipo de Cambio</div>
                <div class="grid-inputs">
                    <div class="input-box">
                        <label>Plazo Liq.</label>
                        <select id="plazo" onchange="fetchData()">
                            <option value="24hs" selected>T+1 (24hs)</option>
                            <option value="ci">Contado Inmediato</option>
                        </select>
                    </div>
                    <div class="input-box">
                        <label>Objetivo</label>
                        <select id="target-tc" onchange="calculate()">
                            <option value="mep">PESOS ➔ MEP (AL30/D)</option>
                            <option value="ccl">PESOS ➔ CABLE (AL30/C)</option>
                        </select>
                    </div>
                    <div class="input-box">
                        <label>Comisión AlyC (%)</label>
                        <input type="number" id="comision" value="0.5" step="0.1" oninput="calculate()">
                    </div>
                    <div class="input-box">
                        <label>Monto a Invertir (ARS)</label>
                        <input type="number" id="monto-ars" value="1000000" oninput="calculate()">
                    </div>
                </div>
            </div>

            <div id="ui-canje" style="display:none">
                <div class="section-title">Calculadora de Canje</div>
                <div class="grid-inputs">
                    <div class="input-box">
                        <label>Dirección</label>
                        <select id="sentido-canje" onchange="calculate()">
                            <option value="m-c">MEP a CABLE (D ➔ C)</option>
                            <option value="c-m">CABLE a MEP (C ➔ D)</option>
                        </select>
                    </div>
                    <div class="input-box">
                        <label>Comisión %</label>
                        <input type="number" id="com-canje" value="0.5" step="0.1" oninput="calculate()">
                    </div>
                    <div class="input-box" style="grid-column: span 2">
                        <label>USD Origen</label>
                        <input type="number" id="monto-usd" value="1000" oninput="calculate()">
                    </div>
                </div>
            </div>

            <div class="market-watch" id="market-display">
                </div>
        </div>

        <div class="card" style="border-color: var(--accent)">
            <div class="section-title">Liquidación Neta</div>
            
            <div class="res-main">
                <div class="res-label" id="main-label">TC IMPLÍCITO FINAL</div>
                <div class="res-val" id="res-main">$ 0.00</div>
            </div>

            <div class="data-list">
                <div class="data-item">
                    <span class="d-label">Inversión Bruta</span>
                    <span class="d-val" id="row-monto">0.00</span>
                </div>
                <div class="data-item">
                    <span class="d-label">Gastos (Comisión + IVA)</span>
                    <span class="d-val red" id="row-com">0.00</span>
                </div>
                <div class="data-item">
                    <span class="d-label">Derechos de Mercado (0.01%)</span>
                    <span class="d-val red" id="row-ddmm">0.00</span>
                </div>
                <hr>
                <div class="data-item">
                    <span class="d-label" style="font-weight: 800; color: white;">TOTAL RECIBIDO</span>
                    <span class="d-val green" id="row-final">0.00</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let prices = { al30: 0, al30d: 0, al30c: 0, oficial: 0 };
        let mode = 'TC';

        // Proxy de conexión para evitar errores de CORS
        async function pfetch(url){
            try {
                const r = await fetch('https://api.allorigins.win/get?url=' + encodeURIComponent(url));
                const d = await r.json();
                return JSON.parse(d.contents);
            } catch (e) {
                const rDirect = await fetch(url);
                return await rDirect.json();
            }
        }

        function setMode(m) {
            mode = m;
            document.getElementById('btn-tc').classList.toggle('active', m==='TC');
            document.getElementById('btn-canje').classList.toggle('active', m==='CANJE');
            document.getElementById('ui-tc').style.display = m==='TC' ? 'block' : 'none';
            document.getElementById('ui-canje').style.display = m==='CANJE' ? 'block' : 'none';
            document.getElementById('main-label').textContent = m==='TC' ? 'TC IMPLÍCITO FINAL' : 'RATIO CANJE NETO';
            calculate();
        }

        async function fetchData() {
            const status = document.getElementById('api-status');
            const plazo = document.getElementById('plazo').value;

            try {
                // Endpoint unificado
                const bondsUrl = plazo === 'ci' ? 'https://data912.com/live/arg_bonds_ci' : 'https://data912.com/live/arg_bonds';
                const data = await pfetch(bondsUrl);

                const findVal = (sym) => {
                    const item = data.find(i => i.symbol.trim().toUpperCase() === sym);
                    return item ? parseFloat(item.c) : 0;
                };

                prices.al30 = findVal('AL30');
                prices.al30d = findVal('AL30D');
                prices.al30c = findVal('AL30C');

                // Obtener Dólar Oficial para DDMM
                const fxData = await pfetch('https://data912.com/live/fx');
                const ofi = fxData.find(i => i.symbol === 'USD_MAYORISTA' || i.symbol === 'USD_OFICIAL_BCRA3500');
                prices.oficial = ofi ? parseFloat(ofi.c) : 865;

                renderMarket();
                calculate();
            } catch(e) {
                console.error(e);
            }
        }

        function calculate() {
            const ddmm_rate = 0.0001; // 0.01% fijo
            if (prices.al30 <= 0 || prices.al30d <= 0) return;

            if (mode === 'TC') {
                const montoArs = parseFloat(document.getElementById('monto-ars').value) || 0;
                const comRate = parseFloat(document.getElementById('comision').value) / 100;
                const pUsd = document.getElementById('target-tc').value === 'mep' ? prices.al30d : prices.al30c;

                // 1. Compra ARS
                const comArs = montoArs * comRate * 1.21;
                const ddmmArs = montoArs * ddmm_rate;
                const netArs = montoArs - comArs - ddmmArs;
                const nominales = netArs / (prices.al30 / 100);

                // 2. Venta USD
                const brutoUsd = (nominales * pUsd) / 100;
                const comUsdArs = (brutoUsd * comRate * 1.21) * prices.oficial;
                const ddmmUsdArs = (brutoUsd * ddmm_rate) * prices.oficial;

                const finalUsd = brutoUsd - (comUsdArs / prices.oficial) - (ddmmUsdArs / prices.oficial);
                const tcFinal = montoArs / finalUsd;

                document.getElementById('res-main').textContent = `$ ${tcFinal.toFixed(2)}`;
                document.getElementById('row-monto').textContent = `$ ${montoArs.toLocaleString()}`;
                document.getElementById('row-com').textContent = `$ ${(comArs + comUsdArs).toFixed(2)}`;
                document.getElementById('row-ddmm').textContent = `$ ${(ddmmArs + ddmmUsdArs).toFixed(2)}`;
                document.getElementById('row-final').textContent = `${finalUsd.toFixed(2)} USD`;
            } else {
                const montoUsd = parseFloat(document.getElementById('monto-usd').value) || 0;
                const comRate = parseFloat(document.getElementById('com-canje').value) / 100;
                const m2c = document.getElementById('sentido-canje').value === 'm-c';
                
                const pIn = m2c ? prices.al30d : prices.al30c;
                const pOut = m2c ? prices.al30c : prices.al30d;

                const valorOpArs = (montoUsd * pIn / 100) * prices.oficial;
                const gastosArs = (valorOpArs * (comRate * 1.21 + ddmm_rate)) * 2;
                
                const finalUsd = (montoUsd * pOut / pIn) - (gastosArs / prices.oficial);
                const ratioNeto = ((finalUsd / montoUsd) - 1) * 100;

                document.getElementById('res-main').textContent = `${ratioNeto.toFixed(2)}%`;
                document.getElementById('row-monto').textContent = `${montoUsd.toFixed(2)} USD`;
                document.getElementById('row-com').textContent = `$ ${(valorOpArs * comRate * 1.21 * 2).toFixed(2)} (ARS)`;
                document.getElementById('row-ddmm').textContent = `$ ${(valorOpArs * ddmm_rate * 2).toFixed(2)} (ARS)`;
                document.getElementById('row-final').textContent = `${finalUsd.toFixed(2)} USD`;
            }
        }

        function renderMarket() {
            document.getElementById('market-display').innerHTML = `
                <div class="m-card"><div class="m-label">AL30</div><div class="m-price">$${prices.al30.toLocaleString()}</div></div>
                <div class="m-card"><div class="m-label">AL30D</div><div class="m-price">u$s${prices.al30d.toFixed(2)}</div></div>
                <div class="m-card"><div class="m-label">AL30C</div><div class="m-price">u$s${prices.al30c.toFixed(2)}</div></div>
            `;
        }

        fetchData();
        setInterval(fetchData, 20000);
    </script>
</body>
</html>
