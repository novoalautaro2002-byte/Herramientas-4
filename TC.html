<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TC & Canje - Terminal Financiera</title>
    <style>
        :root {
            --navy: #0d1b2e; --navy2: #122540; --navy3: #172d4d; --panel: #1a3358;
            --border: #2a4a7a; --blue: #3a6fd8; --blue2: #5b8def; --white: #f0f4ff;
            --gray: #7a99c4; --green: #22d68a; --red: #ff4d6a; --amber: #f0b429;
            --font: 'Inter', sans-serif; --mono: 'JetBrains Mono', monospace;
        }
        body { background: var(--navy); color: var(--white); font-family: var(--font); margin: 0; padding: 15px; font-size: 13px; overflow: hidden; }
        .tc-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
        .btn-group { display: flex; gap: 8px; }
        .btn-mode { background: var(--navy3); border: 1px solid var(--border); color: var(--gray); padding: 6px 14px; cursor: pointer; font-family: var(--mono); font-weight: 700; border-radius: 4px; font-size: 11px; transition: 0.2s; }
        .btn-mode.active { background: var(--blue); color: white; border-color: var(--blue2); }
        .status-pill { font-family: var(--mono); font-size: 10px; color: var(--green); display: flex; align-items: center; gap: 5px; }
        .dot { width: 6px; height: 6px; background: var(--green); border-radius: 50%; box-shadow: 0 0 5px var(--green); }
        .dot.loading { background: var(--amber); box-shadow: 0 0 5px var(--amber); }
        .main-grid { display: grid; grid-template-columns: 1fr 380px; gap: 15px; }
        .card { background: var(--navy2); border: 1px solid var(--border); border-radius: 6px; padding: 15px; }
        .section-title { font-family: var(--mono); font-size: 10px; color: var(--blue2); text-transform: uppercase; margin-bottom: 15px; letter-spacing: 1px; }
        .row { display: flex; gap: 10px; margin-bottom: 12px; }
        .col { flex: 1; display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 9px; color: var(--gray); text-transform: uppercase; font-weight: 600; }
        select, input { background: var(--navy); border: 1px solid var(--border); color: var(--white); font-family: var(--mono); padding: 10px; border-radius: 4px; outline: none; font-size: 13px; }
        input { color: var(--amber); }
        .res-display { background: linear-gradient(180deg, var(--navy3), var(--navy)); border-radius: 6px; padding: 20px; text-align: center; margin-bottom: 15px; border: 1px solid var(--border); }
        .big-price { font-size: 32px; font-weight: 800; color: var(--white); font-family: var(--mono); margin: 5px 0; }
        .data-table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 12px; }
        .data-table td { padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .val { text-align: right; font-weight: 600; }
        .red { color: var(--red); }
        .market-ref { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; padding-top: 15px; border-top: 1px dotted var(--border); }
        .m-item { text-align: center; }
        .m-label { font-size: 9px; color: var(--gray); margin-bottom: 2px; }
        .m-val { font-family: var(--mono); font-size: 11px; font-weight: 700; }
    </style>
</head>
<body>

    <div class="tc-toolbar">
        <div class="btn-group">
            <button id="btn-tc" class="btn-mode active" onclick="setMode('TC')">Tipo de Cambio</button>
            <button id="btn-canje" class="btn-mode" onclick="setMode('CANJE')">Canje</button>
        </div>
        <div class="status-pill" id="api-status"><div class="dot"></div> DATA912 LIVE</div>
    </div>

    <div class="main-grid">
        <div class="card">
            <div id="config-tc">
                <div class="section-title">Calculadora TC</div>
                <div class="row">
                    <div class="col">
                        <label>Plazo</label>
                        <select id="plazo" onchange="tcFetch()">
                            <option value="24hs" selected>T+1 (24hs)</option>
                            <option value="CI">Contado Inmediato</option>
                        </select>
                    </div>
                    <div class="col">
                        <label>Tipo</label>
                        <select id="target-tc" onchange="calculate()">
                            <option value="mep">MEP (AL30/D)</option>
                            <option value="ccl">CCL (AL30/C)</option>
                        </select>
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <label>Comisión %</label>
                        <input type="number" id="comision" value="0.5" step="0.1" oninput="calculate()">
                    </div>
                    <div class="col">
                        <label>Pesos Origen</label>
                        <input type="number" id="monto-ars" value="1000000" oninput="calculate()">
                    </div>
                </div>
            </div>

            <div id="config-canje" style="display:none">
                <div class="section-title">Calculadora Canje</div>
                <div class="row">
                    <div class="col">
                        <label>Sentido</label>
                        <select id="sentido-canje" onchange="calculate()">
                            <option value="m-c">MEP a CABLE (D ➔ C)</option>
                            <option value="c-m">CABLE a MEP (C ➔ D)</option>
                        </select>
                    </div>
                    <div class="col">
                        <label>Comisión %</label>
                        <input type="number" id="com-canje" value="0.5" step="0.1" oninput="calculate()">
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <label>USD Origen</label>
                        <input type="number" id="monto-usd" value="1000" oninput="calculate()">
                    </div>
                </div>
            </div>

            <div class="market-ref" id="market-display"></div>
        </div>

        <div class="card" style="border-color: var(--blue);">
            <div class="section-title">Liquidación Estimada</div>
            <div class="res-display">
                <div id="main-label" style="font-size: 10px; color: var(--gray);">TC IMPLÍCITO FINAL</div>
                <div id="res-main" class="big-price">$ 0.00</div>
            </div>
            <table class="data-table">
                <tr><td>Monto Operado</td><td class="val" id="row-monto">0.00</td></tr>
                <tr><td>Comisión + IVA</td><td class="val red" id="row-com">0.00</td></tr>
                <tr><td>DDMM (0.01%)</td><td class="val red" id="row-ddmm">0.00</td></tr>
                <tr style="border-top: 1px solid var(--blue);"><td style="padding-top:10px; font-weight:700;">RECIBE NETO</td><td class="val" id="row-final" style="padding-top:10px; font-size:16px; color:var(--green);">0.00</td></tr>
            </table>
        </div>
    </div>

    <script>
        let prices = { al30: 0, al30d: 0, al30c: 0, oficial: 865 };
        let mode = 'TC';

        // PROXY COPIADO DE BONOS.HTML
        async function pfetch(url){
            try {
                const response = await fetch('https://api.allorigins.win/get?url=' + encodeURIComponent(url));
                const data = await response.json();
                return JSON.parse(data.contents);
            } catch (e) {
                console.error("Error en proxy:", e);
                return null;
            }
        }

        function setMode(m) {
            mode = m;
            document.getElementById('btn-tc').classList.toggle('active', m==='TC');
            document.getElementById('btn-canje').classList.toggle('active', m==='CANJE');
            document.getElementById('config-tc').style.display = m==='TC' ? 'block' : 'none';
            document.getElementById('config-canje').style.display = m==='CANJE' ? 'block' : 'none';
            document.getElementById('main-label').textContent = m==='TC' ? 'TC IMPLÍCITO FINAL' : 'RATIO CANJE NETO';
            calculate();
        }

        async function tcFetch() {
            const status = document.getElementById('api-status');
            status.innerHTML = '<div class="dot loading"></div> CONECTANDO...';
            const plazo = document.getElementById('plazo').value;

            try {
                // LLAMADO A LA API
                const data = await pfetch('https://data912.com/live/arg_bonds');
                
                if (data && Array.isArray(data)) {
                    const findVal = (tk) => {
                        const item = data.find(i => 
                            (i.ticker || i.symbol || '').replace(/\s+/g,'').toUpperCase() === tk && 
                            i.settlement === plazo
                        );
                        // Probamos todas las posibles propiedades de precio de Data912
                        return item ? parseFloat(item.c || item.last || item.ultimo || item.price || 0) : 0;
                    };

                    prices.al30 = findVal('AL30');
                    prices.al30d = findVal('AL30D');
                    prices.al30c = findVal('AL30C');

                    status.innerHTML = '<div class="dot"></div> DATA912 LIVE';
                } else {
                    status.innerHTML = '<div class="dot" style="background:var(--red)"></div> ERROR FORMATO';
                }
                
                renderMarket();
                calculate();
            } catch(e) {
                status.innerHTML = '<div class="dot" style="background:var(--red)"></div> ERROR API';
            }
        }

        function calculate() {
            const ddmm_rate = 0.0001;
            if (prices.al30 <= 0 || prices.al30d <= 0) return;

            if (mode === 'TC') {
                const montoArs = parseFloat(document.getElementById('monto-ars').value) || 0;
                const comRate = parseFloat(document.getElementById('comision').value) / 100;
                const pUsd = document.getElementById('target-tc').value === 'mep' ? prices.al30d : prices.al30c;

                const comArs = montoArs * comRate * 1.21;
                const ddmmArs = montoArs * ddmm_rate;
                const netArs = montoArs - comArs - ddmmArs;
                const nominales = netArs / (prices.al30 / 100);

                const brutoUsd = (nominales * pUsd) / 100;
                const comUsdArs = (brutoUsd * comRate * 1.21) * prices.oficial;
                const ddmmUsdArs = (brutoUsd * ddmm_rate) * prices.oficial;

                const finalUsd = brutoUsd - (comUsdArs / prices.oficial) - (ddmmUsdArs / prices.oficial);
                const tcFinal = montoArs / finalUsd;

                document.getElementById('res-main').textContent = `$ ${tcFinal.toFixed(2)}`;
                document.getElementById('row-monto').textContent = `$ ${montoArs.toLocaleString()}`;
                document.getElementById('row-com').textContent = `$ ${(comArs + comUsdArs).toFixed(2)}`;
                document.getElementById('row-ddmm').textContent = `$ ${(ddmmArs + ddmmUsdArs).toFixed(2)}`;
                document.getElementById('row-final').textContent = `${finalUsd.toFixed(2)} USD`;
            } else {
                const montoUsd = parseFloat(document.getElementById('monto-usd').value) || 0;
                const comRate = parseFloat(document.getElementById('com-canje').value) / 100;
                const m2c = document.getElementById('sentido-canje').value === 'm-c';
                const pIn = m2c ? prices.al30d : prices.al30c;
                const pOut = m2c ? prices.al30c : prices.al30d;

                const valorOpArs = (montoUsd * pIn / 100) * prices.oficial;
                const gastosArs = (valorOpArs * (comRate * 1.21 + ddmm_rate)) * 2;
                const finalUsd = (montoUsd * pOut / pIn) - (gastosArs / prices.oficial);
                const ratioNeto = ((finalUsd / montoUsd) - 1) * 100;

                document.getElementById('res-main').textContent = `${ratioNeto.toFixed(2)}%`;
                document.getElementById('row-monto').textContent = `${montoUsd.toFixed(2)} USD`;
                document.getElementById('row-com').textContent = `$ ${(valorOpArs * comRate * 1.21 * 2).toFixed(2)} (ARS)`;
                document.getElementById('row-ddmm').textContent = `$ ${(valorOpArs * ddmm_rate * 2).toFixed(2)} (ARS)`;
                document.getElementById('row-final').textContent = `${finalUsd.toFixed(2)} USD`;
            }
        }

        function renderMarket() {
            document.getElementById('market-display').innerHTML = `
                <div class="m-item"><div class="m-label">AL30</div><div class="m-val">$${prices.al30.toFixed(2)}</div></div>
                <div class="m-item"><div class="m-label">AL30D</div><div class="m-val">u$s${prices.al30d.toFixed(2)}</div></div>
                <div class="m-item"><div class="m-label">AL30C</div><div class="m-val">u$s${prices.al30c.toFixed(2)}</div></div>
            `;
        }

        tcFetch();
        setInterval(tcFetch, 30000);
    </script>
</body>
</html>
