<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Investment — Bonos CER</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

:root{
  --navy:   #0d1b2e;
  --navy2:  #122540;
  --navy3:  #172d4d;
  --border: #2a4a7a;
  --border2:#3a5a8a;
  --blue:   #3a6fd8;
  --blue2:  #5b8def;
  --blue3:  #7aa3f0;
  --blue4:  #a8c4f8;
  --white:  #f0f4ff;
  --white2: #d0ddf5;
  --gray:   #7a99c4;
  --gray2:  #4a6a9a;
  --green:  #22d68a;
  --green2: #16a86a;
  --green-bg:#0a2a1a;
  --red:    #ff4d6a;
  --red2:   #cc3a55;
  --red-bg: #2a0a12;
  --amber:  #f0b429;
  --cyan:   #22d4f0;
  --font:   'Inter', sans-serif;
  --mono:   'JetBrains Mono', 'Courier New', monospace;
}

html,body{background:var(--navy);color:var(--white);font-family:var(--font);font-size:13px;min-height:100vh;overflow-x:hidden}

::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--navy2)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* ─── TOP BAR ─── */
.top-bar{
  background:linear-gradient(135deg, var(--navy2) 0%, var(--navy3) 100%);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;height:56px;position:sticky;top:0;z-index:200;
  box-shadow:0 2px 16px rgba(0,0,0,.4);
}
.logo-area{display:flex;align-items:center;gap:12px}
.logo-text{display:flex;flex-direction:column;line-height:1.1}
.logo-text strong{font-size:16px;font-weight:800;color:var(--white);letter-spacing:-.02em}
.logo-text span{font-size:10px;font-weight:500;color:var(--blue3);letter-spacing:.08em;text-transform:uppercase}
.top-right{display:flex;align-items:center;gap:16px}
.top-badge{font-size:10px;font-weight:600;color:var(--blue4);letter-spacing:.06em;font-family:var(--mono)}
#clock{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--blue3);letter-spacing:.04em;
  background:var(--navy);padding:3px 8px;border:1px solid var(--border);border-radius:4px}

/* ─── NAV TABS ─── */
.nav-bar{
  background:var(--navy2);border-bottom:2px solid var(--border);
  display:flex;align-items:stretch;padding:0 20px;gap:0;
}
.nav-tab{
  display:flex;align-items:center;gap:8px;padding:0 22px;height:42px;
  font-family:var(--font);font-size:12px;font-weight:600;
  letter-spacing:.04em;text-transform:uppercase;
  color:var(--gray);border:none;background:none;
  cursor:pointer;border-bottom:2px solid transparent;
  margin-bottom:-2px;transition:all .15s;white-space:nowrap;
}
.nav-tab:hover{color:var(--blue3);background:rgba(58,111,216,.08)}
.nav-tab.active{color:var(--white);border-bottom-color:var(--blue);background:rgba(58,111,216,.12)}
.nav-spacer{flex:1}
.nav-meta{display:flex;align-items:center;gap:8px;padding:0 4px}
.nav-meta-txt{font-size:10px;color:var(--gray2);letter-spacing:.06em;font-family:var(--mono)}

/* ─── PAGE ─── */
.page{display:block;min-height:calc(100vh - 98px)}
.lecap-page{min-height:calc(100vh - 98px);display:flex;flex-direction:column;background:var(--navy2)}
.lc-toolbar{
  background:linear-gradient(90deg,var(--navy3),var(--navy2));
  border-bottom:1px solid var(--border);
  padding:8px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.lc-title{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--blue2);letter-spacing:.06em}
.lc-sub{font-size:10px;color:var(--gray);letter-spacing:.08em;text-transform:uppercase}
.lc-spacer{flex:1}
.lc-refresh-btn{
  background:var(--navy3);border:1px solid var(--border2);color:var(--blue3);
  font-family:var(--mono);font-size:10px;font-weight:700;padding:0 12px;
  cursor:pointer;height:28px;border-radius:4px;letter-spacing:.06em;
  transition:all .15s;display:flex;align-items:center;gap:6px;
}
.lc-refresh-btn:hover{border-color:var(--blue);background:rgba(58,111,216,.15);color:var(--white)}
.lc-status-pill{
  font-size:10px;font-family:var(--mono);padding:2px 10px;border-radius:10px;
  border:1px solid;letter-spacing:.06em;font-weight:600;
}
.lc-status-pill.ok{color:var(--green);border-color:var(--green2);background:var(--green-bg)}
.lc-status-pill.err{color:var(--red);border-color:var(--red2);background:var(--red-bg)}

.lc-filters{display:flex;gap:4px}
.lc-ftab{
  background:var(--navy3);border:1px solid var(--border);color:var(--gray);
  font-family:var(--mono);font-size:10px;font-weight:700;padding:3px 10px;
  cursor:pointer;letter-spacing:.06em;border-radius:3px;height:26px;
  display:flex;align-items:center;transition:all .12s;
}
.lc-ftab.on{background:rgba(58,111,216,.2);color:var(--blue2);border-color:var(--blue)}
.lc-table-wrap{flex:1;overflow:auto}
.lc-table{width:100%;border-collapse:collapse;font-family:var(--mono)}
.lc-table thead th{
  padding:8px 14px;font-size:10px;font-weight:700;
  color:#f0b429;letter-spacing:.12em;text-transform:uppercase;
  text-align:right;white-space:nowrap;border-bottom:2px solid var(--border);
  position:sticky;top:0;background:#0a1525;z-index:2;
}
.lc-table thead th:first-child{text-align:left}
.lc-table tbody tr{border-bottom:1px solid rgba(42,74,122,.4);transition:background .1s}
.lc-table tbody tr:hover{background:rgba(58,111,216,.12)}
.lc-table tbody td{padding:7px 14px;font-size:12px;text-align:right;color:var(--white2);white-space:nowrap}
.lc-table tbody td:first-child{text-align:left}
.lc-ticker{font-weight:700;font-size:13px;color:var(--white);letter-spacing:.04em}

.lc-curves-panel{display:flex;flex-direction:column;background:var(--navy2);border-top:2px solid var(--border2)}
.lc-statusbar{background:var(--navy3);border-top:1px solid var(--border);display:flex;justify-content:space-between;padding:5px 16px;font-size:10px;font-family:var(--mono)}

</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
</head>
<body>

<div class="top-bar">
  <div class="logo-area">
    <div class="logo-text"><strong>Portfolio Investment</strong><span>Sistema de Cálculo Financiero Exacto</span></div>
  </div>
  <div class="top-right"><span id="clock">--:--:--</span></div>
</div>

<div class="nav-bar">
  <button class="nav-tab">◉ Resumen</button>
  <button class="nav-tab active">📊 Bonos CER</button>
</div>

<div class="page">
  <div class="lecap-page">
    <div class="lc-toolbar">
      <div>
        <div class="lc-title">BONOS CER — TIR REAL EXACTA (Newton-Raphson)</div>
        <div class="lc-sub">Motor de flujos basado en condiciones de emisión ByMA</div>
      </div>
      <div class="lc-filters">
        <button class="lc-ftab on" id="f-all" onclick="cerSetFilter('all')">TODOS</button>
        <button class="lc-ftab" id="f-corto" onclick="cerSetFilter('corto')">CORTO</button>
        <button class="lc-ftab" id="f-largo" onclick="cerSetFilter('largo')">LARGO</button>
      </div>
      <div class="lc-spacer"></div>
      <span class="lc-status-pill ok" id="cer-pill">LIVE ●</span>
      <button class="lc-refresh-btn" onclick="cerFetch()">↻ ACTUALIZAR</button>
    </div>

    <div class="lc-table-wrap">
      <table class="lc-table">
        <thead>
          <tr>
            <th>TICKER</th>
            <th>DESCRIPCIÓN</th>
            <th>VENCIMIENTO</th>
            <th>PRECIO DIRTY</th>
            <th>DUR. MOD.</th>
            <th style="color:var(--green)">TIR REAL %</th>
          </tr>
        </thead>
        <tbody id="cer-tbody"></tbody>
      </table>
    </div>

    <div class="lc-curves-panel">
      <div style="position:relative;height:350px;width:100%;padding:16px 32px">
        <canvas id="cer-curve-canvas"></canvas>
      </div>
    </div>

    <div class="lc-statusbar">
      <span id="cer-last-upd" style="color:var(--gray)">—</span>
      <span style="color:var(--blue3)" id="cer-source-info">Cálculos: Act/365, Liq T+1</span>
    </div>
  </div>
</div>

<script>
Chart.register(ChartDataLabels);

// Reloj
setInterval(() => {
    const n = new Date();
    document.getElementById('clock').textContent = n.toLocaleTimeString();
}, 1000);

// Configuración de bonos.
const CER_CONFIG = {
  'X15Y6':  {name:'TZXY May-26A', tipo:'corto', venc:'2026-05-15', cerBase: 701.614},
  'X29Y6':  {name:'TZXY May-26B', tipo:'corto', venc:'2026-05-29', cerBase: 651.8981},
  'TZX26':  {name:'TZXY Jun-26',  tipo:'corto', venc:'2026-06-30', cerBase: 200.388},
  'X31L6':  {name:'TZXY Jul-26',  tipo:'corto', venc:'2026-07-31', cerBase: 685.5506},
  'TX26':   {name:'Boncer Nov-26', tipo:'corto', venc:'2026-11-09', cerBase: 22.544},
  'TX28':   {name:'Boncer Nov-28', tipo:'largo', venc:'2028-11-09', cerBase: 22.544},
  'DICP':   {name:'Discount Pesos', tipo:'largo', venc:'2033-12-31', cerBase: 1.4551}
};

let CER_HOY = 722.35; // Valor T-10 de referencia
let cerData = [];
let cerFilter = 'all';
let cerCurveChart = null;

// MOTOR DE FLUJOS REALES (Reemplaza el CSV)
// Construye los flujos exactos base 100 según el prospecto de emisión.
function getFlujosReales(ticker, fechaLiq) {
    const flows = [];
    const add = (d, cf) => { 
        if (new Date(d + 'T00:00:00') > fechaLiq) flows.push({ date: d, cf: cf }); 
    };

    if (ticker.startsWith('X') || ticker.startsWith('TZX')) {
        // Letras y Bonos Cero Cupón (Bullet 100% al final)
        add(CER_CONFIG[ticker].venc, 100);
    } 
    else if (ticker === 'TX26') {
        // Amortiza 20% semestral. Cupón 2% anual (1% semestral).
        // Mayo 26: Amort 20 + 1% de 40 (residual) = 20.4
        // Nov 26: Amort 20 + 1% de 20 (residual) = 20.2
        add('2026-05-11', 20.40);
        add('2026-11-09', 20.20);
    } 
    else if (ticker === 'TX28') {
        // Amortiza 10% semestral. Cupón 2.25% anual (1.125% SA).
        add('2026-05-11', 10.675);   // Amort 10 + (1.125% de 60)
        add('2026-11-09', 10.5625);  // Amort 10 + (1.125% de 50)
        add('2027-05-11', 10.450);   // Amort 10 + (1.125% de 40)
        add('2027-11-09', 10.3375);  // Amort 10 + (1.125% de 30)
        add('2028-05-11', 10.225);   // Amort 10 + (1.125% de 20)
        add('2028-11-09', 10.1125);  // Amort 10 + (1.125% de 10)
    } 
    else if (ticker === 'DICP') {
        // Amortiza 5% semestral sobre saldo capitalizado (factor 1.845 base 100 orig).
        // Quedan 16 cuotas desde Jun-26. Cuota pura real = 9.225
        // Cupón = 2.915% semestral sobre el saldo residual.
        let residual = 147.60; // Saldo real restante (16 * 9.225)
        const fechas = ['2026-06-30','2026-12-31','2027-06-30','2027-12-31','2028-06-30','2028-12-31','2029-06-30','2029-12-31','2030-06-30','2030-12-31','2031-06-30','2031-12-31','2032-06-30','2032-12-31','2033-06-30','2033-12-31'];
        
        for (let f of fechas) {
            let cupon = residual * 0.02915;
            add(f, 9.225 + cupon);
            residual -= 9.225;
        }
    }

    return flows;
}

// 1. Desinflactar el precio Dirty de pizarra.
function cerCalcularPrecioReal(ticker, pricePesos) {
    const cfg = CER_CONFIG[ticker];
    if (!cfg) return 0;
    const factorCER = CER_HOY / cfg.cerBase;
    return pricePesos / factorCER; 
}

// 2. Resolver TIR Real iterando los flujos Reales contra el Precio Real (Algoritmo Newton-Raphson recuperado)
function cerSolveReal(precioReal, flows, fechaLiq) {
    if (precioReal <= 0 || !flows.length) return 0;

    const futs = flows.map(f => ({
        t: (new Date(f.date + 'T00:00:00') - fechaLiq) / (1000 * 60 * 60 * 24 * 365),
        cf: f.cf
    })).filter(f => f.t > 0);

    let r = 0.05; 
    for (let i = 0; i < 300; i++) {
        let pv = 0; let dpv = 0;
        for (const f of futs) {
            const df = Math.pow(1 + r, f.t);
            pv += f.cf / df;
            dpv -= (f.t * f.cf) / (df * (1 + r));
        }
        const diff = pv - precioReal; 
        if (Math.abs(diff) < 1e-12) break;
        const step = diff / dpv;
        r -= step;
        if (r < -0.99) r = -0.5; if (r > 10) r = 2; 
    }
    return r; // Devuelve tasa decimal
}

// 3. Duration Macauly
function cerMacDuration(teaDecimal, flows, fechaLiq) {
    const futs = flows.map(f => ({
        t: (new Date(f.date + 'T00:00:00') - fechaLiq) / (1000 * 60 * 60 * 24 * 365),
        cf: f.cf
    })).filter(f => f.t > 0);
    
    let sPV = 0, sTPV = 0;
    for (const f of futs) {
        const pv = f.cf / Math.pow(1 + teaDecimal, f.t);
        sPV += pv; sTPV += f.t * pv;
    }
    return sPV > 0 ? sTPV / sPV : 0;
}

// LOOP PRINCIPAL
async function cerFetch() {
    const hoy = new Date(); hoy.setHours(0,0,0,0);
    const fechaLiq = new Date(hoy); fechaLiq.setDate(fechaLiq.getDate() + 1); // T+1

    // Simulación de precios API (Acá iría tu fetch real a data912)
    const mockPrices = {
        'X15Y6': 104.50, 'X29Y6': 112.90, 'TZX26': 368.40, 'X31L6': 108.10,
        'TX26': 1314.00, 'TX28': 1915.00, 'DICP': 48570.00
    };

    cerData = [];
    for (const [ticker, cfg] of Object.entries(CER_CONFIG)) {
        const precio = mockPrices[ticker];
        if (!precio) continue;

        const flujos = getFlujosReales(ticker, fechaLiq);
        if (!flujos.length) continue;

        const precioReal = cerCalcularPrecioReal(ticker, precio);
        const teaDecimal = cerSolveReal(precioReal, flujos, fechaLiq);
        const macD = cerMacDuration(teaDecimal, flujos, fechaLiq);

        cerData.push({
            ticker, ...cfg,
            price: precio,
            macD: macD,
            tirReal: teaDecimal * 100
        });
    }

    document.getElementById('cer-last-upd').textContent = 'Actualizado: ' + new Date().toLocaleTimeString('es-AR');
    renderTable();
    renderCurve();
}

function renderTable() {
    const tbody = document.getElementById('cer-tbody');
    let rows = cerData.filter(b => cerFilter === 'all' || b.tipo === cerFilter);
    rows.sort((a,b) => new Date(a.venc) - new Date(b.venc));
    
    tbody.innerHTML = rows.map(b => `<tr>
        <td><span class="lc-ticker">${b.ticker}</span></td>
        <td style="color:var(--white2);font-size:11px">${b.name}</td>
        <td style="color:var(--blue3)">${b.venc}</td>
        <td>$ ${b.price.toLocaleString('es-AR',{minimumFractionDigits:2})}</td>
        <td style="color:var(--cyan);font-family:var(--mono)">${b.macD.toFixed(2)}</td>
        <td style="font-weight:bold; color:${b.tirReal > 4 ? 'var(--green)' : b.tirReal > 0 ? 'var(--amber)' : 'var(--red)'}">
            ${b.tirReal.toFixed(2)}%
        </td>
    </tr>`).join('');
}

function renderCurve() {
    const canvas = document.getElementById('cer-curve-canvas');
    let pts = cerData.filter(b => cerFilter === 'all' || b.tipo === cerFilter);
    if (!pts.length) return;

    if (cerCurveChart) cerCurveChart.destroy();
    cerCurveChart = new Chart(canvas.getContext('2d'), {
        type: 'scatter',
        data: {
            datasets: [{
                data: pts.map(b => ({ x: b.macD, y: b.tirReal })),
                backgroundColor: pts.map(b => b.tipo === 'corto' ? '#5b8def' : '#f0b429'),
                borderColor: '#fff',
                pointRadius: 6,
                datalabels: {
                    display: true, align: 'top', color: '#c8d8f0', 
                    font: { family: 'monospace', size: 10 },
                    formatter: (v, ctx) => pts[ctx.dataIndex].ticker
                }
            }]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                x: { title: { display: true, text: 'Duration (Años)', color: '#7a99c4'} },
                y: { title: { display: true, text: 'TIR Real (%)', color: '#7a99c4'} }
            }
        }
    });
}

function cerSetFilter(f) {
    cerFilter = f;
    document.querySelectorAll('.lc-ftab').forEach(btn => btn.classList.remove('on'));
    document.getElementById('f-' + f).classList.add('on');
    renderTable(); renderCurve();
}

cerFetch();
</script>
</body>
</html>
