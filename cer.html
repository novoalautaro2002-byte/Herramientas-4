<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Investment — Bonos CER</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

:root{
  --navy:   #0d1b2e;
  --navy2:  #122540;
  --navy3:  #172d4d;
  --border: #2a4a7a;
  --border2:#3a5a8a;
  --blue:   #3a6fd8;
  --blue2:  #5b8def;
  --blue3:  #7aa3f0;
  --blue4:  #a8c4f8;
  --white:  #f0f4ff;
  --white2: #d0ddf5;
  --gray:   #7a99c4;
  --gray2:  #4a6a9a;
  --green:  #22d68a;
  --green2: #16a86a;
  --green-bg:#0a2a1a;
  --red:    #ff4d6a;
  --red2:   #cc3a55;
  --red-bg: #2a0a12;
  --amber:  #f0b429;
  --cyan:   #22d4f0;
  --font:   'Inter', sans-serif;
  --mono:   'JetBrains Mono', 'Courier New', monospace;
}

html,body{background:var(--navy);color:var(--white);font-family:var(--font);font-size:13px;min-height:100vh;overflow-x:hidden}

::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--navy2)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

.top-bar{
  background:linear-gradient(135deg, var(--navy2) 0%, var(--navy3) 100%);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;height:56px;position:sticky;top:0;z-index:200;
  box-shadow:0 2px 16px rgba(0,0,0,.4);
}
.logo-area{display:flex;align-items:center;gap:12px}
.logo-svg{width:40px;height:40px;flex-shrink:0}
.logo-text{display:flex;flex-direction:column;line-height:1.1}
.logo-text strong{font-size:16px;font-weight:800;color:var(--white);letter-spacing:-.02em}
.logo-text span{font-size:10px;font-weight:500;color:var(--blue3);letter-spacing:.08em;text-transform:uppercase}
.top-right{display:flex;align-items:center;gap:16px}
.top-badge{font-size:10px;font-weight:600;color:var(--blue4);letter-spacing:.06em;font-family:var(--mono)}
#clock{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--blue3);letter-spacing:.04em;
  background:var(--navy);padding:3px 8px;border:1px solid var(--border);border-radius:4px}

.nav-bar{
  background:var(--navy2);border-bottom:2px solid var(--border);
  display:flex;align-items:stretch;padding:0 20px;gap:0;
}
.nav-tab{
  display:flex;align-items:center;gap:8px;padding:0 22px;height:42px;
  font-family:var(--font);font-size:12px;font-weight:600;
  letter-spacing:.04em;text-transform:uppercase;
  color:var(--gray);border:none;background:none;
  cursor:pointer;border-bottom:2px solid transparent;
  margin-bottom:-2px;transition:all .15s;white-space:nowrap;
}
.nav-tab:hover{color:var(--blue3);background:rgba(58,111,216,.08)}
.nav-tab.active{color:var(--white);border-bottom-color:var(--blue);background:rgba(58,111,216,.12)}
.nav-spacer{flex:1}
.nav-meta{display:flex;align-items:center;gap:8px;padding:0 4px}
.nav-meta-txt{font-size:10px;color:var(--gray2);letter-spacing:.06em;font-family:var(--mono)}

.page{display:block;min-height:calc(100vh - 98px)}
.lecap-page{min-height:calc(100vh - 98px);display:flex;flex-direction:column;background:var(--navy2)}
.lc-toolbar{
  background:linear-gradient(90deg,var(--navy3),var(--navy2));
  border-bottom:1px solid var(--border);
  padding:8px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.lc-title{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--blue2);letter-spacing:.06em}
.lc-sub{font-size:10px;color:var(--gray);letter-spacing:.08em;text-transform:uppercase}
.lc-spacer{flex:1}
.lc-refresh-btn{
  background:var(--navy3);border:1px solid var(--border2);color:var(--blue3);
  font-family:var(--mono);font-size:10px;font-weight:700;padding:0 12px;
  cursor:pointer;height:28px;border-radius:4px;letter-spacing:.06em;
  transition:all .15s;display:flex;align-items:center;gap:6px;
}
.lc-refresh-btn:hover{border-color:var(--blue);background:rgba(58,111,216,.15);color:var(--white)}
.lc-status-pill{
  font-size:10px;font-family:var(--mono);padding:2px 10px;border-radius:10px;
  border:1px solid;letter-spacing:.06em;font-weight:600;
}
.lc-status-pill.ok{color:var(--green);border-color:var(--green2);background:var(--green-bg)}
.lc-status-pill.loading{color:var(--amber);border-color:#7a5a10;background:rgba(120,80,10,.2);animation:pillblink 1s step-end infinite}
@keyframes pillblink{0%,100%{opacity:1}50%{opacity:.4}}

.lc-filters{display:flex;gap:4px}
.lc-ftab{
  background:var(--navy3);border:1px solid var(--border);color:var(--gray);
  font-family:var(--mono);font-size:10px;font-weight:700;padding:3px 10px;
  cursor:pointer;letter-spacing:.06em;border-radius:3px;height:26px;
  display:flex;align-items:center;transition:all .12s;
}
.lc-ftab.on{background:rgba(58,111,216,.2);color:var(--blue2);border-color:var(--blue)}
.lc-table-wrap{flex:1;overflow:auto}
.lc-table{width:100%;border-collapse:collapse;font-family:var(--mono)}
.lc-table thead th{
  padding:8px 14px;font-size:10px;font-weight:700;
  color:#f0b429;letter-spacing:.12em;text-transform:uppercase;
  text-align:right;position:sticky;top:0;background:#0a1525;z-index:2;
}
.lc-table thead th:first-child{text-align:left}
.lc-table tbody tr{border-bottom:1px solid rgba(42,74,122,.4);transition:background .1s}
.lc-table tbody tr:hover{background:rgba(58,111,216,.12)}
.lc-table tbody td{padding:7px 14px;font-size:12px;text-align:right;color:var(--white2)}
.lc-table tbody td:first-child{text-align:left}
.lc-ticker{font-weight:700;font-size:13px;color:var(--white)}

.lc-curves-panel{display:flex;flex-direction:column;background:var(--navy2);border-top:2px solid var(--border2)}
.lc-statusbar{background:var(--navy3);border-top:1px solid var(--border);display:flex;justify-content:space-between;padding:5px 16px;font-size:10px}

/* Dropdown simples para navegación */
.nav-dropdown{position:relative;display:flex;align-items:stretch}
.nav-dropdown-btn{padding:0 18px;height:42px;font-size:12px;font-weight:600;color:var(--gray);border:none;background:none;cursor:pointer}
.nav-dropdown-menu{display:none;position:absolute;top:42px;left:0;background:var(--navy3);min-width:180px;border:1px solid var(--border);z-index:500}
.nav-dropdown.open .nav-dropdown-menu{display:block}
.nav-dropdown-item{display:block;padding:10px 15px;color:var(--white2);text-decoration:none;font-size:11px}
.nav-dropdown-item:hover{background:var(--blue)}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>

<div class="top-bar">
  <div class="logo-area">
    <div class="logo-text"><strong>Portfolio Investment</strong><span>Sistema de Cálculo Financiero</span></div>
  </div>
  <div class="top-right"><span id="clock">--:--:--</span></div>
</div>

<div class="nav-bar">
  <button class="nav-tab">◉ Resumen</button>
  <div class="nav-dropdown" id="dd-bonos">
    <button class="nav-dropdown-btn" onclick="document.getElementById('dd-bonos').classList.toggle('open')">📊 Bonos ▼</button>
    <div class="nav-dropdown-menu">
      <a class="nav-dropdown-item" href="#">LECAP / BONCAP</a>
      <a class="nav-dropdown-item" href="#">Bonos CER</a>
    </div>
  </div>
</div>

<div id="page-cer" class="page">
  <div class="lecap-page">
    <div class="lc-toolbar">
      <div>
        <div class="lc-title">BONOS CER — Cálculo de TIR Real</div>
        <div class="lc-sub">Ajuste de flujos base 100 sobre precio desinflactado</div>
      </div>
      <div class="lc-filters">
        <button class="lc-ftab on" id="f-all" onclick="cerSetFilter('all')">TODOS</button>
        <button class="lc-ftab" id="f-corto" onclick="cerSetFilter('corto')">CORTO</button>
        <button class="lc-ftab" id="f-largo" onclick="cerSetFilter('largo')">LARGO</button>
      </div>
      <div class="lc-spacer"></div>
      <span class="lc-status-pill loading" id="cer-pill">CARGANDO...</span>
      <button class="lc-refresh-btn" onclick="cerFetch()">↻ ACTUALIZAR</button>
    </div>

    <div class="lc-table-wrap">
      <table class="lc-table">
        <thead>
          <tr>
            <th>TICKER</th>
            <th>VENCIMIENTO</th>
            <th>DÍAS</th>
            <th>PRECIO DIRTY</th>
            <th>DUR. MOD.</th>
            <th style="color:var(--green)">TIR REAL %</th>
          </tr>
        </thead>
        <tbody id="cer-tbody"></tbody>
      </table>
    </div>

    <div class="lc-curves-panel">
      <div style="height:300px;padding:20px"><canvas id="cer-chart"></canvas></div>
    </div>

    <div class="lc-statusbar">
      <span id="cer-upd">—</span>
      <span id="cer-info">Calculando...</span>
    </div>
  </div>
</div>

<script>
// --- DATOS Y CONFIGURACIÓN ---
const CER_CONFIG = {
  'X15Y6':  {venc:'2026-05-15', cerBase: 701.614, tipo:'corto'},
  'X29Y6':  {venc:'2026-05-29', cerBase: 651.8981, tipo:'corto'},
  'TZX26':  {venc:'2026-06-30', cerBase: 200.388, tipo:'corto'},
  'X31L6':  {venc:'2026-07-31', cerBase: 685.5506, tipo:'corto'},
  'TX26':   {venc:'2026-11-09', cerBase: 22.544, tipo:'corto'},
  'TX28':   {venc:'2028-11-09', cerBase: 22.544, tipo:'largo'},
  'DICP':   {venc:'2033-12-31', cerBase: 1.4551, tipo:'largo'},
  'PARP':   {venc:'2038-12-31', cerBase: 1.4551, tipo:'largo'}
};

let CER_VALOR = 722.35; // Valor aproximado si falla la API
let cerData = [], cerFilter = 'all';
let chartInstance = null;

// --- MOTOR FINANCIERO CORREGIDO ---

/**
 * Calcula la TIR Real iterando flujos base 100 contra el Precio Real.
 * Precio Real = Precio Mercado / (CER Hoy / CER Base)
 */
function calcularTirReal(precioMercado, cerBase, vencimiento) {
    const hoy = new Date();
    const liquidacion = new Date();
    liquidacion.setDate(hoy.getDate() + 1); // T+1
    
    const fechaVenc = new Date(vencimiento + 'T00:00:00');
    const t = (fechaVenc - liquidacion) / (1000 * 60 * 60 * 24 * 365); // Tiempo en años
    
    if (t <= 0) return 0;

    // 1. DESINFACTAR PRECIO: Obtenemos el precio "limpio" de inflación (Base 100)
    const factorAjuste = CER_VALOR / cerBase;
    const precioReal = precioMercado / factorAjuste;

    // 2. TIR REAL (Para un bono Bullet asumiendo flujos simplificados de capital 100)
    // Formula: PrecioReal = 100 / (1 + r)^t
    // r = (100 / PrecioReal)^(1/t) - 1
    const tir = Math.pow(100 / precioReal, 1 / t) - 1;
    
    return {
        tir: tir * 100,
        macD: t,
        dias: Math.round(t * 365)
    };
}

async function cerFetch() {
    const pill = document.getElementById('cer-pill');
    pill.textContent = 'ACTUALIZANDO...';

    try {
        // Simulación de fetch de precios (Aquí iría tu pfetch a data912)
        // Usamos valores de referencia para el ejemplo
        const mockPrices = { 'X15Y6': 104.5, 'X29Y6': 113.2, 'TZX26': 368.0, 'TX26': 1315, 'DICP': 48500, 'PARP': 32600 };

        cerData = [];
        for (const [ticker, cfg] of Object.entries(CER_CONFIG)) {
            const precio = mockPrices[ticker] || 100;
            const calculos = calcularTirReal(precio, cfg.cerBase, cfg.venc);
            
            cerData.push({
                ticker,
                ...cfg,
                precio,
                ...calculos
            });
        }

        pill.className = 'lc-status-pill ok';
        pill.textContent = 'LIVE ●';
        document.getElementById('cer-upd').textContent = 'Act: ' + new Date().toLocaleTimeString();
        document.getElementById('cer-info').textContent = `CER Base: ${CER_VALOR.toFixed(2)} | Liq: T+1`;
        
        renderTable();
        renderChart();

    } catch (e) {
        pill.textContent = 'ERROR';
        console.error(e);
    }
}

function renderTable() {
    const tbody = document.getElementById('cer-tbody');
    const filtered = cerData.filter(d => cerFilter === 'all' || d.tipo === cerFilter);
    
    tbody.innerHTML = filtered.map(d => `
        <tr>
            <td><span class="lc-ticker">${d.ticker}</span></td>
            <td>${d.venc}</td>
            <td>${d.dias}d</td>
            <td>$ ${d.precio.toLocaleString()}</td>
            <td>${d.macD.toFixed(2)}</td>
            <td style="font-weight:bold; color:${d.tir > 0 ? '#22d68a' : '#ff4d6a'}">${d.tir.toFixed(2)}%</td>
        </tr>
    `).join('');
}

function renderChart() {
    const ctx = document.getElementById('cer-chart').getContext('2d');
    if (chartInstance) chartInstance.destroy();

    const datasets = cerData.filter(d => cerFilter === 'all' || d.tipo === cerFilter);

    chartInstance = new Chart(ctx, {
        type: 'scatter',
        data: {
            datasets: [{
                label: 'Curva Real',
                data: datasets.map(d => ({ x: d.macD, y: d.tir, label: d.ticker })),
                backgroundColor: '#3a6fd8',
                borderColor: '#fff',
                showLine: true,
                tension: 0.4
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                x: { title: { display: true, text: 'Duración (Años)', color: '#7a99c4' } },
                y: { title: { display: true, text: 'TIR Real %', color: '#7a99c4' } }
            },
            plugins: {
                legend: { display: false }
            }
        }
    });
}

function cerSetFilter(f) {
    cerFilter = f;
    document.querySelectorAll('.lc-ftab').forEach(btn => btn.classList.remove('on'));
    document.getElementById('f-' + f).classList.add('on');
    renderTable();
    renderChart();
}

// Reloj
setInterval(() => {
    const n = new Date();
    document.getElementById('clock').textContent = n.toLocaleTimeString();
}, 1000);

// Iniciar
cerFetch();
</script>
</body>
</html>
