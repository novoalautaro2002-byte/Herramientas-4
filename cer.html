<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Investment — Bonos CER</title>
<style>
/* ─── ESTILOS ORIGINALES PRESERVADOS ─── */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --navy: #0d1b2e; --navy2: #122540; --navy3: #172d4d; --border: #2a4a7a; --border2:#3a5a8a;
  --blue: #3a6fd8; --blue2: #5b8def; --blue3: #7aa3f0; --white: #f0f4ff; --white2: #d0ddf5;
  --gray: #7a99c4; --green: #22d68a; --amber: #f0b429; --cyan: #22d4f0;
  --font: 'Inter', sans-serif; --mono: 'JetBrains Mono', monospace;
}
html,body{background:var(--navy);color:var(--white);font-family:var(--font);font-size:13px;min-height:100vh;overflow-x:hidden}
.top-bar{background:linear-gradient(135deg, var(--navy2) 0%, var(--navy3) 100%); border-bottom:1px solid var(--border); display:flex;align-items:center;justify-content:space-between; padding:0 20px;height:56px;position:sticky;top:0;z-index:200;}
.logo-area{display:flex;align-items:center;gap:12px}
.logo-text strong{font-size:16px;font-weight:800;color:var(--white)}
.nav-bar{background:var(--navy2);border-bottom:2px solid var(--border);display:flex;padding:0 20px;}
.nav-tab{padding:0 22px;height:42px;font-weight:600;color:var(--gray);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;}
.nav-tab.active{color:var(--white);border-bottom-color:var(--blue);background:rgba(58,111,216,.12)}
.lecap-page{min-height:calc(100vh - 98px);display:flex;flex-direction:column;background:var(--navy2)}
.lc-toolbar{background:linear-gradient(90deg,var(--navy3),var(--navy2)); border-bottom:1px solid var(--border); padding:8px 20px;display:flex;align-items:center;gap:12px;}
.lc-table{width:100%;border-collapse:collapse;font-family:var(--mono)}
.lc-table thead tr{background:#0a1525;border-bottom:2px solid var(--border)}
.lc-table thead th{padding:8px 14px;font-size:10px;color:#f0b429;text-align:right;text-transform:uppercase;position:sticky;top:0;z-index:2}
.lc-table tbody tr{border-bottom:1px solid rgba(42,74,122,.4);cursor:pointer;}
.lc-table tbody td{padding:7px 14px;font-size:12px;text-align:right;color:var(--white2);}
#clock{font-family:var(--mono);font-size:12px;color:var(--blue3);padding:3px 8px;border:1px solid var(--border);border-radius:4px}
.lc-status-pill.ok{color:var(--green);border-color:var(--green2);background:#0a2a1a;font-size:10px;padding:2px 10px;border-radius:10px;border:1px solid;}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>

<div class="top-bar">
  <div class="logo-area">
    <div class="logo-text"><strong>Portfolio Investment</strong><span>Sistema de Cálculo Financiero</span></div>
  </div>
  <div class="top-right"><span id="clock">--:--:--</span></div>
</div>

<div class="nav-bar">
  <button class="nav-tab active">◎ Bonos CER</button>
</div>

<div class="lecap-page">
  <div class="lc-toolbar">
    <div>
      <div style="font-family:var(--mono);font-size:13px;font-weight:700;color:var(--blue2)">BONOS CER — VALORIZACIÓN REAL</div>
      <div id="cer-status-text" style="font-size:10px;color:var(--gray)">Metodología: Flujos Normalizados (Base 100) vs Precio Desinflactado</div>
    </div>
    <div style="flex:1"></div>
    <span class="lc-status-pill ok" id="cer-pill">LIVE ●</span>
    <button onclick="cerFetch()" style="background:var(--navy3);border:1px solid var(--border2);color:var(--blue3);padding:5px 12px;border-radius:4px;cursor:pointer">↻ ACTUALIZAR</button>
  </div>

  <div class="lc-table-wrap" style="flex:1;overflow:auto">
    <table class="lc-table">
      <thead><tr>
        <th style="text-align:left">TICKER</th>
        <th>VENCIMIENTO</th>
        <th>DÍAS</th>
        <th>PRECIO DIRTY</th>
        <th>DUR. MOD.</th>
        <th style="color:var(--green)">TIR REAL %</th>
      </tr></thead>
      <tbody id="cer-tbody"></tbody>
    </table>
  </div>

  <div style="position:relative;height:320px;width:100%;padding:16px">
    <canvas id="cer-curve-canvas"></canvas>
  </div>
</div>

<script>
// 1. DATA DE FLUJOS (CSV ORIGINAL)
const DATOS_CSV_FLUJOS = `X15Y6	Fecha	Por 1 VN
	15/5/2026	$ 10.336
X29Y6	Fecha	Por 1 VN
	29/5/2026	$ 11.125
TZX26	Fecha	Por 1 VN
	30/6/2026	$ 36.190
TX26	Fecha	Por 1 VN
	11/5/2026	$ 65.624
	9/11/2026	$ 64.980
DICP	Fecha	Por 1 VN
	30/6/2026	$ 464.082
	31/12/2026	$ 454.857
	30/6/2027	$ 445.632
PARP	Fecha	Por 1 VN
	31/3/2026	$ 44.107
	30/9/2026	$ 44.107`;

// 2. PARSEADOR
const flujosParseados = {};
let tickerAct = '';
DATOS_CSV_FLUJOS.split('\n').forEach(line => {
    line = line.trim(); if (!line) return;
    if (line.includes('Por 1 VN')) {
        tickerAct = line.split('\t')[0].trim().toUpperCase();
        flujosParseados[tickerAct] = [];
    } else if (tickerAct && line.includes('/')) {
        const parts = line.split('\t').filter(p => p.trim() !== '');
        let fp = parts[0].trim().split('/');
        let fechaStr = `${fp[2]}-${fp[1].padStart(2,'0')}-${fp[0].padStart(2,'0')}`;
        let valStr = parts[1].replace('$', '').trim().replace(/\./g, '').replace(',', '.');
        flujosParseados[tickerAct].push({ date: fechaStr, amount: parseFloat(valStr) });
    }
});

const CER_CONFIG = {
  'X15Y6':  {venc:'2026-05-15', cerBase: 701.614},
  'X29Y6':  {venc:'2026-05-29', cerBase: 651.8981},
  'TZX26':  {venc:'2026-06-30', cerBase: 200.388},
  'TX26':   {venc:'2026-11-09', cerBase: 22.544},
  'DICP':   {venc:'2033-12-31', cerBase: 1.4551},
  'PARP':   {venc:'2038-12-31', cerBase: 1.4551}
};

let CER_HOY = 724.54;
let cerCurveChart = null;

// 3. MOTOR DE CÁLCULO FINANCIERO CORREGIDO (TEA REAL)
function resolverTirReal(precioDirty, ticker, liq) {
    const cfg = CER_CONFIG[ticker];
    const flows = flujosParseados[ticker] ? flujosParseados[ticker].filter(f => new Date(f.date+'T00:00:00') > liq) : [];
    if (!cfg || !flows.length) return 0;

    // Desinflactar Precio: Dirty / (CER_hoy / CER_base)
    const coeficiente = CER_HOY / cfg.cerBase;
    const precioRealBase100 = precioDirty / coeficiente;

    // Normalización: Llevamos los flujos del CSV a escala Base 100 para coincidir con el precio
    const sumaNominalFutura = flows.reduce((s, f) => s + f.amount, 0);
    const futs = flows.map(f => ({
        t: (new Date(f.date + 'T00:00:00') - liq) / (31536000000), // milisegundos en un año
        cf: (f.amount / sumaNominalFutura) * 100 
    }));

    // Iteración Newton-Raphson
    let r = 0.05;
    for (let i = 0; i < 100; i++) {
        let pv = 0, dpv = 0;
        futs.forEach(f => {
            let df = Math.pow(1 + r, f.t);
            pv += f.cf / df;
            dpv -= (f.t * f.cf) / (df * (1 + r));
        });
        let diff = pv - precioRealBase100;
        if (Math.abs(diff) < 1e-10) break;
        r = r - (diff / dpv);
    }
    return r;
}

function calcularMD(r, ticker, liq) {
    const flows = flujosParseados[ticker] ? flujosParseados[ticker].filter(f => new Date(f.date+'T00:00:00') > liq) : [];
    let num = 0, den = 0;
    flows.forEach(f => {
        let t = (new Date(f.date + 'T00:00:00') - liq) / 31536000000;
        let pv = f.amount / Math.pow(1 + r, t);
        num += t * pv; den += pv;
    });
    return den > 0 ? (num / den) / (1 + r) : 0;
}

// 4. ACTUALIZACIÓN
async function cerFetch() {
    const liq = new Date(); liq.setDate(liq.getDate() + 1); liq.setHours(0,0,0,0);
    try {
        const rCer = await fetch('https://criptoya.com/api/cer');
        const dCer = await rCer.json();
        if (dCer.value) CER_HOY = dCer.value;

        const rPx = await fetch('https://api.allorigins.win/get?url=' + encodeURIComponent('https://criptoya.com/api/bcra/bonos_cer'));
        const dPx = await rPx.json();
        const precios = JSON.parse(dPx.contents);

        let html = '', chartData = [];
        Object.keys(CER_CONFIG).forEach(ticker => {
            const px = precios.find(p => p.symbol === ticker)?.last || 0;
            if (px > 0) {
                const r = resolverTirReal(px, ticker, liq);
                const md = calcularMD(r, ticker, liq);
                const dias = Math.round((new Date(CER_CONFIG[ticker].venc) - liq) / 86400000);
                chartData.push({ticker, x: md, y: r*100});
                html += `<tr><td><span style="font-weight:700">${ticker}</span></td><td>${CER_CONFIG[ticker].venc}</td><td>${dias}d</td><td>$ ${px.toLocaleString()}</td><td>${md.toFixed(2)}</td><td style="color:var(--green);font-weight:800">${(r*100).toFixed(2)}%</td></tr>`;
            }
        });
        document.getElementById('cer-tbody').innerHTML = html;
        renderChart(chartData);
    } catch(e) { console.error(e); }
}

function renderChart(data) {
    const ctx = document.getElementById('cer-curve-canvas').getContext('2d');
    if (cerCurveChart) cerCurveChart.destroy();
    cerCurveChart = new Chart(ctx, {
        type: 'scatter',
        data: { datasets: [{ label: 'Bonos CER', data: data, backgroundColor: '#22d68a' }] },
        options: { responsive: true, maintainAspectRatio: false }
    });
}

setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);
cerFetch();
</script>
</body>
</html>
