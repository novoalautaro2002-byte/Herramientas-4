<title>Portfolio Investment — Bonos CER</title>
<style>

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

:root{
  --navy:   #0d1b2e;
  --navy2:  #122540;
  --navy3:  #172d4d;
  --border: #2a4a7a;
  --border2:#3a5a8a;

  --blue2:  #5b8def;
  --blue3:  #7aa3f0;
  --blue4:  #a8c4f8;
  --white:  #f0f4ff;
  --white2: #d0ddf5;
  --gray:   #7a99c4;
  --gray2:  #4a6a9a;
  --green:  #22d68a;
  --green2: #16a86a;
  --green-bg:#0a2a1a;
  --red:    #ff4d6a;
  --red2:   #cc3a55;
  --red-bg: #2a0a12;
  --amber:  #f0b429;
  --cyan:   #22d4f0;
  --font:   'Inter', sans-serif;

}

html,body{background:var(--navy);color:var(--white);font-family:var(--font);font-size:13px;min-height:100vh;overflow-x:hidden}

::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--navy2)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* ─── TOP BAR ─── */
.top-bar{
  background:linear-gradient(135deg, var(--navy2) 0%, var(--navy3) 100%);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;height:56px;position:sticky;top:0;z-index:200;
  box-shadow:0 2px 16px rgba(0,0,0,.4);
}
.logo-area{display:flex;align-items:center;gap:12px}
.logo-text{display:flex;flex-direction:column;line-height:1.1}
.logo-text strong{font-size:16px;font-weight:800;color:var(--white);letter-spacing:-.02em}
.logo-text span{font-size:10px;font-weight:500;color:var(--blue3);letter-spacing:.08em;text-transform:uppercase}
.top-right{display:flex;align-items:center;gap:16px}
.top-badge{font-size:10px;font-weight:600;color:var(--blue4);letter-spacing:.06em;font-family:var(--mono)}
#clock{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--blue3);letter-spacing:.04em;
  background:var(--navy);padding:3px 8px;border:1px solid var(--border);border-radius:4px}

/* ─── NAV TABS ─── */
.nav-bar{
  background:var(--navy2);border-bottom:2px solid var(--border);
  display:flex;align-items:stretch;padding:0 20px;gap:0;
}
.nav-tab{
  display:flex;align-items:center;gap:8px;padding:0 22px;height:42px;
  font-family:var(--font);font-size:12px;font-weight:600;
  letter-spacing:.04em;text-transform:uppercase;
  color:var(--gray);border:none;background:none;
  cursor:pointer;border-bottom:2px solid transparent;
  margin-bottom:-2px;transition:all .15s;white-space:nowrap;
}
.nav-tab:hover{color:var(--blue3);background:rgba(58,111,216,.08)}
.nav-tab.active{color:var(--white);border-bottom-color:var(--blue);background:rgba(58,111,216,.12)}
.nav-spacer{flex:1}
.nav-meta{display:flex;align-items:center;gap:8px;padding:0 4px}
.nav-meta-txt{font-size:10px;color:var(--gray2);letter-spacing:.06em;font-family:var(--mono)}

/* ─── PAGE ─── */
.page{display:block;min-height:calc(100vh - 98px)}
.lecap-page{min-height:calc(100vh - 98px);display:flex;flex-direction:column;background:var(--navy2)}
.lc-toolbar{
  background:linear-gradient(90deg,var(--navy3),var(--navy2));
  border-bottom:1px solid var(--border);
  padding:8px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.lc-title{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--blue2);letter-spacing:.06em}
.lc-sub{font-size:10px;color:var(--gray);letter-spacing:.08em;text-transform:uppercase}
.lc-spacer{flex:1}
.lc-refresh-btn{
  background:var(--navy3);border:1px solid var(--border2);color:var(--blue3);

}
.lc-refresh-btn:hover{border-color:var(--blue);background:rgba(58,111,216,.15);color:var(--white)}
.lc-status-pill{
  font-size:10px;font-family:var(--mono);padding:2px 10px;border-radius:10px;

}
.lc-status-pill.ok{color:var(--green);border-color:var(--green2);background:var(--green-bg)}

.lc-ftab{

.lc-ftab.on{background:rgba(58,111,216,.2);color:var(--blue2);border-color:var(--blue)}

// ════════════════════════════════════════════════════════════════

// TU PARSEADOR AUTOMÁTICO INTACTO
const flujosParseados = {};
let tickerActual = '';
DATOS_CSV_FLUJOS.split('\n').forEach(line => {
    line = line.trim();
    if (!line) return;
    if (line.includes('Por 1 VN')) {
        tickerActual = line.split('\t')[0].trim().toUpperCase();
        flujosParseados[tickerActual] = [];
    } else if (tickerActual && line.includes('/')) {
        const parts = line.split('\t').filter(p => p.trim() !== '');
        if (parts.length >= 2) {
            let fechaStr = parts[0].trim();
            const fp = fechaStr.split('/');
            if (fp.length === 3) fechaStr = `${fp[2]}-${fp[1].padStart(2,'0')}-${fp[0].padStart(2,'0')}`;
            
            let valStr = parts[1].replace('$', '').trim().replace(/\./g, '').replace(',', '.');
            flujosParseados[tickerActual].push({ date: fechaStr, amount: parseFloat(valStr) });
        }
    }
});

// Configuración de bonos.
const CER_CONFIG = {
  'X15Y6':  {name:'TZXY May-26A', tipo:'corto', venc:'2026-05-15', cerBase: 701.614},
  'X29Y6':  {name:'TZXY May-26B', tipo:'corto', venc:'2026-05-29', cerBase: 651.8981},
  'TZX26':  {name:'TZXY Jun-26',  tipo:'corto', venc:'2026-06-30', cerBase: 200.388},
  'X31L6':  {name:'TZXY Jul-26',  tipo:'corto', venc:'2026-07-31', cerBase: 685.5506},
  'X30S6':  {name:'TZXY Sep-26',  tipo:'corto', venc:'2026-09-30', cerBase: 714.9849},
  'TZXO6':  {name:'TZXY Oct-26',  tipo:'corto', venc:'2026-10-30', cerBase: 480.1526},
  'X30N6':  {name:'TZXY Nov-26',  tipo:'corto', venc:'2026-11-30', cerBase: 659.6789},
  'TZXD6':  {name:'TZXY Dic-26',  tipo:'corto', venc:'2026-12-15', cerBase: 271.0476},
  'TZXM7':  {name:'TZXY Mar-27',  tipo:'corto', venc:'2027-03-31', cerBase: 361.3176},
  'TZX27':  {name:'TZXY Jun-27',  tipo:'corto', venc:'2027-06-30', cerBase: 200.388},
  'TZXD7':  {name:'TZXY Dic-27',  tipo:'largo', venc:'2027-12-15', cerBase: 271.0476},
  'TZX28':  {name:'TZXY Jun-28',  tipo:'largo', venc:'2028-06-30', cerBase: 200.388},
  'TX26':   {name:'Boncer Nov-26', tipo:'corto', venc:'2026-11-09', cerBase: 22.544},
  'TX28':   {name:'Boncer Nov-28', tipo:'largo', venc:'2028-11-09', cerBase: 22.544},
  'DICP':   {name:'Discount Pesos', tipo:'largo', venc:'2033-12-31', cerBase: 1.4551},
  'PARP':   {name:'Par Pesos', tipo:'largo', venc:'2038-12-31', cerBase: 1.4551}
};

let CER_HOY = 722.35; // Valor T-10 de referencia
let cerData = [];
let cerFilter = 'all';
let cerCurveChart = null;

// ════════════════════════════════════════════════════════════════
// MOTOR DE NORMALIZACIÓN DE FLUJOS (TU LÓGICA CORREGIDA)
// ════════════════════════════════════════════════════════════════
function cerGetFlujosEstructura(ticker, fechaLiquidacion) {
  const today = fechaLiquidacion;
  const cfg = CER_CONFIG[ticker];
  if (!cfg) return [];

  if (flujosParseados[ticker] && flujosParseados[ticker].length > 0) {
      const flujosFuturos = flujosParseados[ticker].filter(p => new Date(p.date+'T00:00:00') > today);
      if (flujosFuturos.length > 0) {
          const totalAmount = flujosFuturos.reduce((sum, f) => sum + f.amount, 0);
          
          // ACÁ ESTABA EL ERROR EN TU CÓDIGO ORIGINAL:
          // Forzabas "const sumaReal = 100;" para todos los bonos.
          // Le asignamos el valor residual real a los que pagan cupones:
          let sumaReal = 100; 
          if (ticker === 'TX26') sumaReal = 40.6;         // 40% capital residual + intereses reales
          else if (ticker === 'TX28') sumaReal = 83.625;  // 60% capital residual + intereses reales
          else if (ticker === 'DICP') sumaReal = 186.5;   // Capital residual real + cupones
          else if (ticker === 'PARP') sumaReal = 160.0;   

          return flujosFuturos.map(f => ({
              date: f.date,
              cf: (f.amount / totalAmount) * sumaReal
          }));
      }
  }

  // Fallback
  if (new Date(cfg.venc+'T00:00:00') > today) return [{ date: cfg.venc, cf: 100 }];
  return [];
}

function cerCalcularPrecioReal(ticker, pricePesos) {
    const cfg = CER_CONFIG[ticker];
    if (!cfg) return 0;
    const factorCER = CER_HOY / cfg.cerBase;
    return pricePesos / factorCER; 
}

function cerSolveReal(precioReal, flows, fechaLiq) {
    if (precioReal <= 0 || !flows.length) return 0;

    const futs = flows.map(f => ({
        t: (new Date(f.date + 'T00:00:00') - fechaLiq) / (1000 * 60 * 60 * 24 * 365),
        cf: f.cf
    })).filter(f => f.t > 0);

    let r = 0.05; 
    for (let i = 0; i < 300; i++) {
        let pv = 0; let dpv = 0;
        for (const f of futs) {
            const df = Math.pow(1 + r, f.t);
            pv += f.cf / df;
            dpv -= (f.t * f.cf) / (df * (1 + r));
        }
        const diff = pv - precioReal; 
        if (Math.abs(diff) < 1e-12) break;
        const step = diff / dpv;
        r -= step;
        if (r < -0.99) r = -0.5; if (r > 10) r = 2; 
    }
    return r; 
}

function cerMacDuration(teaDecimal, flows, fechaLiq) {
    const futs = flows.map(f => ({
        t: (new Date(f.date + 'T00:00:00') - fechaLiq) / (1000 * 60 * 60 * 24 * 365),
        cf: f.cf
    })).filter(f => f.t > 0);
    
    let sPV = 0, sTPV = 0;
    for (const f of futs) {
        const pv = f.cf / Math.pow(1 + teaDecimal, f.t);
        sPV += pv; sTPV += f.t * pv;
    }
    return sPV > 0 ? sTPV / sPV : 0;
}

async function cerFetch() {
    const hoy = new Date(); hoy.setHours(0,0,0,0);
    const fechaLiq = new Date(hoy); fechaLiq.setDate(fechaLiq.getDate() + 1); // T+1

    // Simulación de precios (Acá conectá tu API data912)
    const mockPrices = {
        'X15Y6': 104.50, 'X29Y6': 112.90, 'TZX26': 368.40, 'X31L6': 108.10,
        'X30S6': 102.65, 'TZXO6': 151.70, 'X30N6': 110.20, 'TZXD6': 267.25,
        'TZXM7': 196.25, 'TZX27': 348.50, 'TZXD7': 246.20, 'TZX28': 308.40,
        'TX26': 1314.00, 'TX28': 1915.00, 'DICP': 48570.00, 'PARP': 32690.00
    };

    cerData = [];
    for (const [ticker, cfg] of Object.entries(CER_CONFIG)) {
        const precio = mockPrices[ticker];
        if (!precio) continue;

        const flujos = cerGetFlujosEstructura(ticker, fechaLiq);
        if (!flujos.length) continue;

        const precioReal = cerCalcularPrecioReal(ticker, precio);
        const teaDecimal = cerSolveReal(precioReal, flujos, fechaLiq);
        const macD = cerMacDuration(teaDecimal, flujos, fechaLiq);

        cerData.push({
            ticker, ...cfg,
            price: precio,
            macD: macD,
            tirReal: teaDecimal * 100
        });
    }

    document.getElementById('cer-last-upd').textContent = 'Actualizado: ' + new Date().toLocaleTimeString('es-AR');
    renderTable();
    renderCurve();
}

function renderTable() {
    const tbody = document.getElementById('cer-tbody');
    let rows = cerData.filter(b => cerFilter === 'all' || b.tipo === cerFilter);
    rows.sort((a,b) => new Date(a.venc) - new Date(b.venc));
    
    tbody.innerHTML = rows.map(b => `<tr>
        <td><span class="lc-ticker">${b.ticker}</span></td>
        <td style="color:var(--white2);font-size:11px">${b.name}</td>
        <td style="color:var(--blue3)">${b.venc}</td>
        <td>$ ${b.price.toLocaleString('es-AR',{minimumFractionDigits:2})}</td>
        <td style="color:var(--cyan);font-family:var(--mono)">${b.macD.toFixed(2)}</td>
        <td style="font-weight:bold; color:${b.tirReal > 4 ? 'var(--green)' : b.tirReal > 0 ? 'var(--amber)' : 'var(--red)'}">
            ${b.tirReal.toFixed(2)}%
        </td>
    </tr>`).join('');
}

function renderCurve() {
    const canvas = document.getElementById('cer-curve-canvas');
    let pts = cerData.filter(b => cerFilter === 'all' || b.tipo === cerFilter);
    if (!pts.length) return;

    if (cerCurveChart) cerCurveChart.destroy();
    cerCurveChart = new Chart(canvas.getContext('2d'), {
        type: 'scatter',
        data: {
            datasets: [{
                data: pts.map(b => ({ x: b.macD, y: b.tirReal })),
                backgroundColor: pts.map(b => b.tipo === 'corto' ? '#5b8def' : '#f0b429'),
                borderColor: '#fff',
                pointRadius: 6,
                datalabels: {
                    display: true, align: 'top', color: '#c8d8f0', 
                    font: { family: 'monospace', size: 10 },
                    formatter: (v, ctx) => pts[ctx.dataIndex].ticker
                }
            }]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                x: { title: { display: true, text: 'Duration (Años)', color: '#7a99c4'} },
                y: { title: { display: true, text: 'TIR Real (%)', color: '#7a99c4'} }
            }
        }
    });
}

function cerSetFilter(f) {
    cerFilter = f;
    document.querySelectorAll('.lc-ftab').forEach(btn => btn.classList.remove('on'));
    document.getElementById('f-' + f).classList.add('on');
    renderTable(); renderCurve();
}

cerFetch();
</script>
