<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Investment — Bonos CER</title>
<style>
/* ─── RESTAURACIÓN DE ESTILOS ORIGINALES ─── */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --navy: #0d1b2e; --navy2: #122540; --navy3: #172d4d; --border: #2a4a7a; --border2:#3a5a8a;
  --blue: #3a6fd8; --blue2: #5b8def; --blue3: #7aa3f0; --white: #f0f4ff; --white2: #d0ddf5;
  --gray: #7a99c4; --green: #22d68a; --amber: #f0b429; --cyan: #22d4f0;
  --font: 'Inter', sans-serif; --mono: 'JetBrains Mono', monospace;
}
body{background:var(--navy);color:var(--white);font-family:var(--font);font-size:13px;min-height:100vh}
.top-bar{background:linear-gradient(135deg, var(--navy2) 0%, var(--navy3) 100%); border-bottom:1px solid var(--border); display:flex;align-items:center;justify-content:space-between; padding:0 20px;height:56px;}
.logo-text strong{font-size:16px;font-weight:800;letter-spacing:-.02em}
.logo-text span{font-size:10px;color:var(--blue3);text-transform:uppercase;display:block}
.lc-toolbar{background:linear-gradient(90deg,var(--navy3),var(--navy2)); border-bottom:1px solid var(--border); padding:8px 20px;display:flex;align-items:center;gap:12px;}
.lc-table{width:100%;border-collapse:collapse;font-family:var(--mono)}
.lc-table thead th{padding:8px 14px;font-size:10px;color:var(--amber);text-align:right;text-transform:uppercase;border-right:1px solid rgba(42,74,122,.4);background:#0a1525;position:sticky;top:0;}
.lc-table tbody tr{border-bottom:1px solid rgba(42,74,122,.4);transition:background .1s;}
.lc-table tbody tr:hover{background:rgba(58,111,216,.12)}
.lc-table tbody td{padding:7px 14px;font-size:12px;text-align:right;color:var(--white2);border-right:1px solid rgba(42,74,122,.25);}
.lc-ticker{font-weight:700;font-size:13px;color:var(--white)}
#clock{font-family:var(--mono);font-size:12px;color:var(--blue3);background:var(--navy);padding:3px 8px;border:1px solid var(--border);border-radius:4px}
.lc-refresh-btn{background:var(--navy3);border:1px solid var(--border2);color:var(--blue3);font-family:var(--mono);font-size:10px;font-weight:700;padding:6px 12px;cursor:pointer;border-radius:4px;}
</style>
</head>
<body>

<div class="top-bar">
    <div class="logo-area">
        <div class="logo-text"><strong>Portfolio Investment</strong><span>Sistema de Cálculo Financiero</span></div>
    </div>
    <div id="clock">--:--:--</div>
</div>

<div class="lecap-page">
    <div class="lc-toolbar">
        <div>
            <div style="font-family:var(--mono);font-size:13px;font-weight:700;color:var(--blue2)">BONOS CER — TIR REAL DE MERCADO</div>
            <div id="cer-status-text" style="font-size:10px;color:var(--gray);text-transform:uppercase">Cargando CER...</div>
        </div>
        <div style="flex:1"></div>
        <button class="lc-refresh-btn" onclick="cerFetch()">↻ ACTUALIZAR</button>
    </div>

    <div class="lc-table-wrap">
        <table class="lc-table">
            <thead>
                <tr>
                    <th style="text-align:left">Ticker</th>
                    <th>Vencimiento</th>
                    <th>Días</th>
                    <th>Precio Dirty</th>
                    <th>Precio Real</th>
                    <th>Dur. Mod.</th>
                    <th style="color:var(--green)">TIR Real %</th>
                </tr>
            </thead>
            <tbody id="cer-tbody">
                </tbody>
        </table>
    </div>
</div>

<script>
// 1. FLUJOS CSV ORIGINALES
const DATOS_CSV_FLUJOS = `X15Y6	Fecha	Por 1 VN
	15/5/2026	$ 10.336
X29Y6	Fecha	Por 1 VN
	29/5/2026	$ 11.125
TZX26	Fecha	Por 1 VN
	30/6/2026	$ 36.190
TX26	Fecha	Por 1 VN
	11/5/2026	$ 65.624
	9/11/2026	$ 64.980
DICP	Fecha	Por 1 VN
	30/6/2026	$ 464.082
	31/12/2026	$ 454.857
	30/6/2027	$ 445.632
PARP	Fecha	Por 1 VN
	31/3/2026	$ 44.107
	30/9/2026	$ 44.107`; // Acortado para el ejemplo, usá tu CSV completo

// 2. PARSEADOR DE FLUJOS
const flujosParseados = {};
DATOS_CSV_FLUJOS.split('\n').forEach(line => {
    line = line.trim();
    if (line.includes('Por 1 VN')) {
        tickerActual = line.split('\t')[0].trim().toUpperCase();
        flujosParseados[tickerActual] = [];
    } else if (line.includes('/')) {
        const parts = line.split('\t').filter(p => p.trim() !== '');
        let fp = parts[0].trim().split('/');
        let fechaStr = `${fp[2]}-${fp[1].padStart(2,'0')}-${fp[0].padStart(2,'0')}`;
        let valStr = parts[1].replace('$', '').trim().replace(/\./g, '').replace(',', '.');
        flujosParseados[tickerActual].push({ date: fechaStr, amount: parseFloat(valStr) });
    }
});

const CER_CONFIG = {
    'X15Y6': {cerBase: 701.61, venc:'2026-05-15'},
    'X29Y6': {cerBase: 651.90, venc:'2026-05-29'},
    'TZX26': {cerBase: 200.39, venc:'2026-06-30'},
    'TX26':  {cerBase: 22.544, venc:'2026-11-09'},
    'DICP':  {cerBase: 1.455,  venc:'2033-12-31'},
    'PARP':  {cerBase: 1.455,  venc:'2038-12-31'}
};

let CER_HOY = 724.54;

// 3. NUEVA LÓGICA DE CÁLCULO FINANCIERO
function calcularTIR(precioDirty, ticker, flujos) {
    const liq = new Date(); liq.setDate(liq.getDate() + 1);
    const cfg = CER_CONFIG[ticker];
    
    // PASO 1: Desinflactar Precio (Aislamos inflación)
    const coef = CER_HOY / cfg.cerBase;
    const precioReal = precioDirty / coef;

    // PASO 2: Flujos Reales (lo que cobrarías si la infla fuera 0 de acá en adelante)
    const futs = flujos.map(f => ({
        t: (new Date(f.date + 'T00:00:00') - liq) / (1000 * 60 * 60 * 24 * 365),
        cf: f.amount
    })).filter(f => f.t > 0);

    if (!futs.length) return 0;

    // PASO 3: Resolver Tasa Real (TEA)
    let r = 0.05;
    for (let i = 0; i < 60; i++) {
        let pv = 0, dpv = 0;
        futs.forEach(f => {
            let df = Math.pow(1 + r, f.t);
            pv += f.cf / df;
            dpv -= (f.t * f.cf) / (df * (1 + r));
        });
        // IMPORTANTE: Escala. Si el flujo es por VN 1000 (como $36.000) y el precio es por VN 100
        // Ajustamos la comparación. 
        let error = pv - (precioReal * 1000 / 100); 
        if (Math.abs(error) < 0.001) break;
        r = r - (error / dpv);
    }
    return r;
}

// 4. ACTUALIZACIÓN DE INTERFAZ
async function cerFetch() {
    document.getElementById('cer-tbody').innerHTML = '<tr><td colspan="7" style="text-align:center;padding:20px">Actualizando precios...</td></tr>';
    
    try {
        const rCer = await fetch('https://criptoya.com/api/cer');
        const dCer = await rCer.json();
        CER_HOY = dCer.value;
        document.getElementById('cer-status-text').innerText = `CER HOY: ${CER_HOY.toFixed(4)} | LIQ: T+1`;

        // Simulamos o traemos precios de API
        const rPx = await fetch('https://api.allorigins.win/get?url=' + encodeURIComponent('https://criptoya.com/api/bcra/bonos_cer'));
        const dPx = await rPx.json();
        const precios = JSON.parse(dPx.contents);

        let html = '';
        Object.keys(CER_CONFIG).forEach(ticker => {
            const px = precios.find(p => p.symbol === ticker)?.last || 0;
            if (px > 0) {
                const flujos = flujosParseados[ticker] || [];
                const tir = calcularTIR(px, ticker, flujos) * 100;
                const coef = CER_HOY / CER_CONFIG[ticker].cerBase;
                const dias = Math.round((new Date(CER_CONFIG[ticker].venc) - new Date()) / 86400000);

                html += `<tr>
                    <td style="text-align:left" class="lc-ticker">${ticker}</td>
                    <td style="color:var(--blue3)">${CER_CONFIG[ticker].venc}</td>
                    <td style="color:var(--gray)">${dias}d</td>
                    <td style="font-weight:700">$ ${px.toLocaleString()}</td>
                    <td>$ ${(px/coef).toFixed(2)}</td>
                    <td>${(dias/400).toFixed(2)}</td>
                    <td style="color:var(--green);font-weight:800;font-size:14px">${tir.toFixed(2)}%</td>
                </tr>`;
            }
        });
        document.getElementById('cer-tbody').innerHTML = html;
    } catch(e) {
        document.getElementById('cer-tbody').innerHTML = '<tr><td colspan="7">Error de conexión</td></tr>';
    }
}

// Reloj y arranque
setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);
cerFetch();
</script>
</body>
</html>
cerFetch();
</script>
</body>
</html>
