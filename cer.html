.top-bar{background:linear-gradient(135deg, var(--navy2) 0%, var(--navy3) 100%); border-bottom:1px solid var(--border); display:flex;align-items:center;justify-content:space-between; padding:0 20px;height:56px;position:sticky;top:0;z-index:200;}

.nav-tab{padding:0 22px;height:42px;font-size:12px;font-weight:600;color:var(--gray);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;}

.lecap-page{min-height:calc(100vh - 98px);display:flex;flex-direction:column;background:var(--navy2)}

.lc-table{width:100%;border-collapse:collapse;font-family:var(--mono)}
.lc-table thead th{padding:8px 14px;font-size:10px;color:#f0b429;text-align:right;border-right:1px solid rgba(42,74,122,.4);position:sticky;top:0;background:#0a1525;}

.lc-ticker{font-weight:700;color:var(--white)}
.lc-curves-panel{border-top:2px solid var(--border2)}
#clock{font-family:var(--mono);color:var(--blue3);padding:3px 8px;border:1px solid var(--border);border-radius:4px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>

<div class="top-bar">

        <div class="logo-text"><strong>Portfolio Investment</strong><span>Sistema de Cálculo Financiero</span></div>

</div>

<div class="nav-bar">

<div id="page-cer" class="page active">
<div class="lecap-page">
    <div class="lc-toolbar">
        <div>
            <div style="font-family:var(--mono);color:var(--blue2);font-weight:700">BONOS CER — TIR REAL DE MERCADO</div>
            <div id="cer-status-text" style="font-size:10px;color:var(--gray)">Calculando sobre Precio Desinflactado...</div>
        </div>
        <div class="lc-spacer" style="flex:1"></div>
        <span class="lc-status-pill ok" id="cer-pill">LIVE ●</span>
        <button class="lc-refresh-btn" onclick="cerFetch()" style="background:var(--navy3);border:1px solid var(--border2);color:var(--blue3);padding:5px 10px;cursor:pointer">↻ ACTUALIZAR</button>
    </div>

    <div class="lc-table-wrap">
        <table class="lc-table">
            <thead>
                <tr>
                    <th style="text-align:left">TICKER</th>
                    <th>VENCIMIENTO</th>
                    <th>PRECIO DIRTY</th>
                    <th>COEF. CER</th>
                    <th>DUR. MOD.</th>
                    <th style="color:var(--green)">TIR REAL %</th>

    <div class="lc-curves-panel">

            <canvas id="cer-curve-canvas"></canvas>

    </div>
</div>

<script>
// 1. DATA DE FLUJOS (Mantenemos tus datos exactos)

`;

// 2. PARSEADOR ORIGINAL
const flujosParseados = {};
let tickerActual = '';
DATOS_CSV_FLUJOS.split('\n').forEach(line => {
    line = line.trim(); if (!line) return;
    if (line.includes('Por 1 VN')) {
        tickerActual = line.split('\t')[0].trim().toUpperCase();
        flujosParseados[tickerActual] = [];
    } else if (tickerActual && line.includes('/')) {
        const parts = line.split('\t').filter(p => p.trim() !== '');
        if (parts.length >= 2) {
            let fp = parts[0].trim().split('/');
            let fechaStr = `${fp[2]}-${fp[1].padStart(2,'0')}-${fp[0].padStart(2,'0')}`;
            let valStr = parts[1].replace('$', '').trim().replace(/\./g, '').replace(',', '.');
            flujosParseados[tickerActual].push({ date: fechaStr, amount: parseFloat(valStr) });
        }
    }
});

const CER_CONFIG = {
    'X15Y6':  {cerBase: 701.61,  venc:'2026-05-15'},
    'X29Y6':  {cerBase: 651.90,  venc:'2026-05-29'},
    'TZX26':  {cerBase: 200.39,  venc:'2026-06-30'},
    'X31L6':  {cerBase: 685.55,  venc:'2026-07-31'},
    'X30S6':  {cerBase: 714.98,  venc:'2026-09-30'},
    'TZXO6':  {cerBase: 480.15,  venc:'2026-10-30'},
    'X30N6':  {cerBase: 659.68,  venc:'2026-11-30'},
    'TZXD6':  {cerBase: 271.05,  venc:'2026-12-15'},
    'TZXM7':  {cerBase: 361.32,  venc:'2027-03-31'},
    'TZX27':  {cerBase: 200.39,  venc:'2027-06-30'},
    'TX26':   {cerBase: 22.544,  venc:'2026-11-09'},
    'TX28':   {cerBase: 22.544,  venc:'2028-11-09'},
    'DICP':   {cerBase: 1.455,   venc:'2033-12-31'},
    'PARP':   {cerBase: 1.455,   venc:'2038-12-31'}
};

let CER_HOY = 722.35;
let cerData = [], cerCurveChart = null;

// 3. NUEVA LÓGICA DE CÁLCULO (LO ÚNICO MODIFICADO)
function resolverTirReal(precioDirty, ticker, flujos) {
    const hoy = new Date();
    const liq = new Date(hoy); liq.setDate(liq.getDate() + 1); // T+1
    
    const cfg = CER_CONFIG[ticker];
    if (!cfg) return 0;

    // A. Desinflactamos el precio de mercado para llevarlo a "Moneda Base"
    const coeficiente = CER_HOY / cfg.cerBase;
    const precioReal = precioDirty / coeficiente;

    // B. Filtramos flujos futuros (tus montos del CSV ya son VN o proporcionales reales)
    const futs = flujos.map(f => ({
        t: (new Date(f.date + 'T00:00:00') - liq) / (1000 * 60 * 60 * 24 * 365),
        cf: f.amount
    })).filter(f => f.t > 0);

    if (futs.length === 0) return 0;

    // C. Newton-Raphson para TIR Real
    let r = 0.05;
    for (let i = 0; i < 100; i++) {
        let pv = 0, dpv = 0;
        for (const f of futs) {
            let df = Math.pow(1 + r, f.t);
            pv += f.cf / df;
            dpv -= (f.t * f.cf) / (df * (1 + r));
        }
        let diff = pv - (precioReal * (futs[0].cf > 1000 ? 1 : 0.01)); // Ajuste escala VN 100 vs VN 1
        // Nota: Si el flujo es p/lámina de 1000, el precioReal se compara directo.
        // Como tus flujos son grandes ($36.190), asumimos escala VN.
        
        let error = pv - precioReal;
        if (Math.abs(error) < 0.0001) break;
        r = r - (error / dpv);
    }
    return r;
}

// Cálculo de Duration Modificada
function calcularMD(r, flujos) {
    const liq = new Date(); liq.setDate(liq.getDate() + 1);
    const futs = flujos.map(f => ({
        t: (new Date(f.date + 'T00:00:00') - liq) / (1000 * 60 * 60 * 24 * 365),
        cf: f.amount
    })).filter(f => f.t > 0);
    
    let numeradore = 0, vpn = 0;
    for (const f of futs) {
        let pv = f.cf / Math.pow(1 + r, f.t);
        numeradore += f.t * pv;
        vpn += pv;
    }
    return vpn > 0 ? (numeradore / vpn) / (1 + r) : 0;
}

// 4. FUNCIONES DE ACTUALIZACIÓN Y RENDER (MANTENIDAS)
async function cerFetch() {
    // Obtenemos CER real
    try {
        const rCer = await fetch('https://criptoya.com/api/cer');
        const dCer = await rCer.json();
        if (dCer.value) CER_HOY = dCer.value;
    } catch(e) {}

    document.getElementById('cer-status-text').innerText = `CER: ${CER_HOY.toFixed(4)} | Act: ${new Date().toLocaleTimeString()}`;

    // Obtenemos Precios
    try {
        const rPx = await fetch('https://api.allorigins.win/get?url=' + encodeURIComponent('https://criptoya.com/api/bcra/bonos_cer'));
        const dPx = await rPx.json();
        const precios = JSON.parse(dPx.contents);

        cerData = [];
        const tbody = document.getElementById('cer-tbody');
        let html = '';

        Object.keys(CER_CONFIG).forEach(ticker => {
            const pxData = precios.find(p => p.symbol === ticker);
            const price = pxData ? pxData.last : 0;
            if (price > 0) {
                const flows = flujosParseados[ticker] || [];
                const r = resolverTirReal(price, ticker, flows);
                const md = calcularMD(r, flows);
                const coef = CER_HOY / CER_CONFIG[ticker].cerBase;

                cerData.push({ticker, x: md, y: r*100});

                html += `<tr>
                    <td style="text-align:left"><span class="lc-ticker">${ticker}</span></td>
                    <td style="color:var(--blue3)">${CER_CONFIG[ticker].venc}</td>
                    <td style="font-weight:700">$ ${price.toLocaleString()}</td>
                    <td>${coef.toFixed(4)}</td>
                    <td style="color:var(--cyan)">${md.toFixed(2)}</td>
                    <td style="color:var(--green); font-weight:800; font-size:14px">${(r*100).toFixed(2)}%</td>
                </tr>`;
            }
        });
        tbody.innerHTML = html;
        renderChart();
    } catch(e) { console.error(e); }
}

function renderChart() {
    const ctx = document.getElementById('cer-curve-canvas').getContext('2d');
    if (cerCurveChart) cerCurveChart.destroy();
    cerCurveChart = new Chart(ctx, {
        type: 'scatter',
        data: {
            datasets: [{
                label: 'Curva CER',
                data: cerData,
                backgroundColor: '#22d68a',
                borderColor: '#16a86a',
                pointRadius: 6
            }]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            scales: {
                x: { title: { display: true, text: 'Duration Modificada', color: '#7a99c4' } },
                y: { title: { display: true, text: 'TIR Real %', color: '#7a99c4' } }
            }
        }
    });
}

setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);
cerFetch();
</script>
