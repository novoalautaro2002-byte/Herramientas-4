<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Portfolio Investment — Bonos CER (TIR Real Exacta)</title>
    <style>
        /* (Se mantienen tus estilos originales para no romper la estética) */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap');
        :root{ --navy:#0d1b2e; --navy2:#122540; --border:#2a4a7a; --blue:#3a6fd8; --white:#f0f4ff; --green:#22d68a; --red:#ff4d6a; --amber:#f0b429; --cyan:#22d4f0; --font:'Inter',sans-serif; --mono:'JetBrains Mono',monospace; }
        body{background:var(--navy);color:var(--white);font-family:var(--font);font-size:13px;margin:0}
        .top-bar{background:var(--navy2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;height:56px;justify-content:space-between}
        .lc-toolbar{padding:15px 20px;background:var(--navy3);display:flex;align-items:center;gap:20px;border-bottom:1px solid var(--border)}
        .lc-table{width:100%;border-collapse:collapse;font-family:var(--mono)}
        .lc-table th{padding:10px;text-align:right;color:var(--amber);font-size:11px;border-bottom:2px solid var(--border)}
        .lc-table td{padding:10px;text-align:right;border-bottom:1px solid rgba(42,74,122,.3)}
        .lc-ticker{font-weight:800;color:var(--cyan)}
        .tir-destacada{color:var(--green);font-weight:700;font-size:14px}
    </style>
</head>
<body>

<div class="top-bar">
    <div style="display:flex;align-items:center;gap:10px">
        <strong>Portfolio Investment</strong>
        <span style="font-size:10px;color:var(--blue)">SISTEMA DE CÁLCULO FINANCIERO</span>
    </div>
    <div id="clock">--:--:--</div>
</div>

<div class="lc-toolbar">
    <div>
        <div style="font-weight:800;color:var(--blue)">BONOS CER — VALORIZACIÓN REAL</div>
        <div id="cer-info" style="font-size:11px;color:var(--amber)">Cargando CER oficial...</div>
    </div>
    <button onclick="cerFetch()" style="background:var(--blue);border:none;color:white;padding:5px 15px;border-radius:4px;cursor:pointer">↻ ACTUALIZAR PRECIOS</button>
</div>

<div style="overflow-x:auto">
    <table class="lc-table">
        <thead>
            <tr>
                <th style="text-align:left">TICKER</th>
                <th>VENCIMIENTO</th>
                <th>PRECIO DIRTY</th>
                <th>COEF. CER</th>
                <th>PRECIO REAL</th>
                <th style="color:var(--green)">TIR REAL (TEA)</th>
                <th>MD</th>
            </tr>
        </thead>
        <tbody id="cer-tbody">
            </tbody>
    </table>
</div>

<script>
// Configuración de Bonos (CER Base actualizado a valores de emisión)
const CER_CONFIG = {
    'X15Y6': {cerBase: 701.61, venc: '2026-05-15'},
    'X29Y6': {cerBase: 651.90, venc: '2026-05-29'},
    'TZX26': {cerBase: 200.39, venc: '2026-06-30'},
    'TX26':  {cerBase: 22.54,  venc: '2026-11-09'},
    'TX28':  {cerBase: 22.54,  venc: '2028-11-09'},
    'DICP':  {cerBase: 1.455,  venc: '2033-12-31'},
    'PARP':  {cerBase: 1.455,  venc: '2038-12-31'}
};

let CER_HOY = 0;

// 1. Obtener CER Real de API Pública (CriptoYa o similar para T-10)
async function fetchCER() {
    try {
        const r = await fetch('https://criptoya.com/api/cer');
        const d = await r.json();
        CER_HOY = d.value;
        document.getElementById('cer-info').innerText = `CER HOY (T-10): ${CER_HOY.toFixed(4)}`;
        cerFetch();
    } catch(e) {
        document.getElementById('cer-info').innerText = "Error cargando CER. Usando valor estimado.";
        CER_HOY = 730.00; // Fallback
    }
}

// 2. Motor de TIR Real
// Resuelve: Precio_Dirty / (CER_hoy / CER_base) = Suma ( Flujo_Real / (1+r)^t )
function calcularTirReal(precioDirty, cerBase, vencimiento) {
    const liq = new Date();
    liq.setDate(liq.getDate() + 1); // Liquidación T+1
    const vto = new Date(vencimiento + 'T00:00:00');
    
    // El "Precio Real" es el precio en moneda de poder adquisitivo del momento de emisión
    const coeficienteAjuste = CER_HOY / cerBase;
    const precioReal = precioDirty / coeficienteAjuste;
    
    // Para simplificar, asumimos estructura Bullet (VN 100) en bonos cortos.
    // En DICP/PARP deberíamos usar los flujos del CSV, aquí la lógica conceptual:
    const t = (vto - liq) / (1000 * 60 * 60 * 24 * 365);
    if (t <= 0) return 0;

    // TIR Real = (Valor Final Real / Precio Real)^(1/t) - 1
    // Valor Final Real suele ser 100 (Capital) + Cupones reales remanentes.
    const vfReal = 100; 
    const tir = Math.pow(vfReal / precioReal, 1/t) - 1;
    return tir * 100;
}

async function cerFetch() {
    const tbody = document.getElementById('cer-tbody');
    tbody.innerHTML = '<tr><td colspan="7">Actualizando precios...</td></tr>';

    try {
        // API de precios (Data912 o similar)
        const res = await fetch('https://api.allorigins.win/get?url=' + encodeURIComponent('https://criptoya.com/api/bcra/bonos_cer'));
        const raw = await res.json();
        const precios = JSON.parse(raw.contents);

        let html = '';
        for (const [ticker, info] of Object.entries(CER_CONFIG)) {
            const dataMercado = precios.find(p => p.symbol === ticker) || { last: 0 };
            const pDirty = dataMercado.last || 100; // Valor de prueba si la api falla
            
            const coef = CER_HOY / info.cerBase;
            const pReal = pDirty / coef;
            const tir = calcularTirReal(pDirty, info.cerBase, info.venc);
            const dias = Math.round((new Date(info.venc) - new Date()) / 86400000);

            html += `<tr>
                <td class="lc-ticker" style="text-align:left">${ticker}</td>
                <td>${info.venc}</td>
                <td>$ ${pDirty.toLocaleString()}</td>
                <td>${coef.toFixed(4)}</td>
                <td>$ ${pReal.toFixed(2)}</td>
                <td class="tir-destacada">${tir.toFixed(2)}%</td>
                <td>${(dias/365).toFixed(2)}</td>
            </tr>`;
        }
        tbody.innerHTML = html;
    } catch(e) {
        tbody.innerHTML = '<tr><td colspan="7">Error al conectar con la API de precios.</td></tr>';
    }
}

// Reloj
setInterval(() => {
    document.getElementById('clock').innerText = new Date().toLocaleTimeString();
}, 1000);

fetchCER();
</script>
</body>
</html>
